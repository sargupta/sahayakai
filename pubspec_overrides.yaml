# LOCAL ONLY - not part of the repo (excluded via .git/info/exclude).
#
# Why this exists:
#   Flutter 3.44.0 marked `IconData` a `final class` (flutter commit 5940fcf3,
#   2026-03-24). lucide_icons 0.257.0 declares `LucideIconData extends IconData`,
#   which therefore fails to compile on 3.44+ with:
#       "The class 'IconData' can't be extended outside of its library because
#        it's a final class."
#   0.257.0 is the newest lucide_icons release, so there is no upstream fix.
#
#   The project's CI pins Flutter 3.41.6, where the stock package works fine.
#   This override exists ONLY so the app can be run locally on the 3.44.x SDK
#   that is installed on this machine, while that 3.41.6 SDK is downloading.
#
#   The patch is purely mechanical: LucideIconData's only job was to inject
#   fontFamily:'Lucide' / fontPackage:'lucide_icons' into IconData, so those
#   two arguments are now passed directly at each of the 1191 call sites. The
#   public API (LucideIcons.<name> is an IconData) is unchanged, and no app
#   code references LucideIconData by name.
#
# DELETE THIS FILE once Flutter 3.41.6 is installed - the stock package compiles
# there and the override is unnecessary.
dependency_overrides:
  lucide_icons:
    path: C:\Users\sachi\dev\lucide_icons-patched