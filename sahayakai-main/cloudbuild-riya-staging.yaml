# cloudbuild-riya-staging.yaml — PREPARED, NOT RUN. Manual submit only; no trigger points here.
#
# One non-production Cloud Run service, `sahayakai-riya-staging`, for the single authorised Riya
# Test call and its post-call webhook. It is a SEPARATE service on purpose:
#   - `sahayakai-preview` is shared by QA and redeployed from `develop` with --update-env-vars,
#     which would carry Riya's live-dial flags into every later preview revision;
#   - prod `sahayakai-hotfix-resilience` keeps SAMPARK_*=false (cloudbuild.yaml, gate test).
#
# Safety built into this service:
#   - SAMPARK_FIRESTORE_DATABASE=sampark-nonprod: Riya refuses real calls without it.
#   - Test mode only (Live is refused in code); calls ring only the school's saved test phone.
#   - SAMPARK_RIYA_TEST_DAILY_CAP=1: one real Riya test call per school per day.
#   - Demo schools (isDemoData) are Practice-only for Riya (DEMO_SCHOOL_PRACTICE_ONLY).
#   - VOICE_PROVIDER, Vobiz and Twilio secrets are NOT bound: attendance parent calls cannot dial here.
#   - Secrets come from Secret Manager (dedicated RIYA_* secrets), never plaintext or NEXT_PUBLIC_.
#   - max-instances=1.
#
# Submit (only after written approval; see docs/sampark/RIYA_LOCAL_SETUP.md §11.3):
#   gcloud builds submit .. --project=sahayakai-b4248 --config=cloudbuild-riya-staging.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD),_AGENT_ID=agent_…,_AGENT_BRANCH_ID=agtbrch_…,_PHONE_NUMBER_ID=phnum_…,_SOURCE_AGENT_ID=agent_…

substitutions:
  _SERVICE: sahayakai-riya-staging
  _REGISTRY: cloud-run-source-deploy
  _REGION: asia-southeast1
  _AGENT_ID: ''
  _AGENT_BRANCH_ID: ''
  _PHONE_NUMBER_ID: ''
  _SOURCE_AGENT_ID: ''

steps:
  - id: require-ids
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for v in "_AGENT_ID=${_AGENT_ID}" "_PHONE_NUMBER_ID=${_PHONE_NUMBER_ID}" "_SOURCE_AGENT_ID=${_SOURCE_AGENT_ID}"; do
          [ -n "$${v#*=}" ] || { echo "missing substitution $${v%%=*}"; exit 1; }
        done
        [ "${_AGENT_ID}" != "${_SOURCE_AGENT_ID}" ] || { echo "refusing: the agent is the source agent"; exit 1; }

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: sahayakai-main
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_SERVICE}:$SHORT_SHA
      - --build-arg=GIT_SHA=$SHORT_SHA
      - --build-arg=BUILD_ID=$BUILD_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=sahayakai-b4248-mumbai
      - --file=Dockerfile
      - .
    waitFor: [require-ids]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_SERVICE}:$SHORT_SHA']
    waitFor: [build]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --allow-unauthenticated
      - --max-instances=1
      - --min-instances=0
      - --set-secrets=ELEVENLABS_API_KEY=RIYA_ELEVENLABS_API_KEY:latest,ELEVENLABS_WEBHOOK_SECRET=RIYA_ELEVENLABS_WEBHOOK_SECRET:latest,SAMPARK_PII_KEY=RIYA_SAMPARK_PII_KEY:latest,SAMPARK_PHONE_PEPPER=RIYA_SAMPARK_PHONE_PEPPER:latest,PROFILE_COMPLETE_COOKIE_SECRET=PROFILE_COMPLETE_COOKIE_SECRET:latest
      - --set-env-vars=NODE_ENV=production,DEMO_MODE=true,SAMPARK_ENABLED=true,SAMPARK_ELEVENLABS_ENABLED=true,SAMPARK_LIVE_DIAL_ENABLED=true,SAMPARK_FIRESTORE_DATABASE=sampark-nonprod,SAMPARK_RIYA_PURPOSES=ptm_invitation,SAMPARK_RIYA_TEST_DAILY_CAP=1,ELEVENLABS_AGENT_ID=${_AGENT_ID},ELEVENLABS_AGENT_BRANCH_ID=${_AGENT_BRANCH_ID},ELEVENLABS_AGENT_PHONE_NUMBER_ID=${_PHONE_NUMBER_ID},ELEVENLABS_SOURCE_AGENT_ID=${_SOURCE_AGENT_ID},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=sahayakai-b4248-mumbai
      - --quiet
    waitFor: [push]

  # The webhook route must answer 401 to an unsigned request: proves this code is deployed, the
  # flags are on, and signature checking is active — without sending any event.
  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        url=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --project=$PROJECT_ID --format='value(status.url)')
        code=$$(curl -s -o /dev/null -m 60 -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$$url/api/webhooks/elevenlabs-riya")
        echo "unsigned POST $$url/api/webhooks/elevenlabs-riya -> $$code (expected 401)"
        [ "$$code" = "401" ]
    waitFor: [deploy]

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
