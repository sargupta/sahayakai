# cloudbuild-preview.yaml
#
# Preview deploy pipeline for SahayakAI. Triggered on push to `develop`
# via the Cloud Build GitHub trigger `sahayakai-preview-deploy`.
#
# Deploys to the `sahayakai-preview` Cloud Run service (separate from
# prod `sahayakai-hotfix-resilience`). Preview is the staging tier where
# develop tip lands automatically so teachers / QA / Abhishek can validate
# features against production-shaped infra before promoting to main + prod.
#
# Why a separate file from cloudbuild.yaml:
#   - Different target service (preview, not prod)
#   - Preview gets DEMO_MODE=true env var (gates demo-only surfaces)
#   - Routes traffic immediately (preview is low-stakes; tagged-revision
#     ceremony of prod is unnecessary here)
#   - Distinct _SERVICE substitution so scripts/safe-deploy.sh's
#     build-in-flight guard can tell prod and preview builds apart
#
# Cost note: preview Cloud Run runs at min-instances=0 (cold start ~3-5s
# on first request after idle, ~$5-10/mo). Bump to 1 if QA team finds
# cold start annoying (~$30-50/mo).

substitutions:
  _SERVICE: sahayakai-preview
  _PROD_REGISTRY: cloud-run-source-deploy

steps:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  # `dir: sahayakai-main` is required: Cloud Build clones the WHOLE repo
  # to /workspace, so without this step's `dir`, --file=Dockerfile would
  # resolve to /workspace/Dockerfile (which doesn't exist — Dockerfile
  # lives at /workspace/sahayakai-main/Dockerfile).
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: sahayakai-main
    args:
      - build
      - --tag=asia-southeast1-docker.pkg.dev/$PROJECT_ID/${_PROD_REGISTRY}/sahayakai-preview:$SHORT_SHA
      - --tag=asia-southeast1-docker.pkg.dev/$PROJECT_ID/${_PROD_REGISTRY}/sahayakai-preview:latest
      - --build-arg=GIT_SHA=$SHORT_SHA
      - --build-arg=GIT_SHA_FULL=$COMMIT_SHA
      - --build-arg=BUILD_ID=$BUILD_ID
      - --file=Dockerfile
      - .

  # ── 2. Push both tags ─────────────────────────────────────────────────────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/${_PROD_REGISTRY}/sahayakai-preview:$SHORT_SHA
    waitFor: [build]
  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/${_PROD_REGISTRY}/sahayakai-preview:latest
    waitFor: [build]

  # ── 3. Deploy to preview. ────────────────────────────────────────────────
  # NOTE (2026-08-24): the previous comment here claimed "no --no-traffic
  # ceremony, latest tip always serves". That was never true. Passing
  # `--tag=` makes gcloud imply --no-traffic, so every build landed a ready
  # revision at 0% and the preview URL stayed frozen — it served a 2026-08-11
  # revision for two weeks while the trigger kept building happily. Same
  # builds-but-never-promotes failure as the prod split-brain. Step 4 now
  # promotes explicitly; the `dev-<sha>` tag URL still reaches a specific SHA.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sahayakai-preview
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/${_PROD_REGISTRY}/sahayakai-preview:$SHORT_SHA
      - --region=asia-southeast1
      - --project=$PROJECT_ID
      - --tag=dev-$SHORT_SHA
      # ADK shadow-mode env vars (2026-06-05). Without these the dispatchers
      # fail-fast and parity data is never collected. See qa/REALIGNMENT.md.
      - --update-env-vars=DEMO_MODE=true,NODE_ENV=production,NEXT_PUBLIC_SAHAYAKAI_AGENTS_URL=https://sahayakai-agents-zwydpvyuca-as.a.run.app,SAHAYAKAI_AGENTS_URL=https://sahayakai-agents-zwydpvyuca-as.a.run.app,SAHAYAKAI_AGENTS_AUDIENCE=https://sahayakai-agents-zwydpvyuca-as.a.run.app
      - --quiet
    waitFor: [push-sha]

  # ── 4. Promote, then prove the URL actually serves it. ───────────────────
  # Promotion is explicit because step 3 cannot take traffic on its own.
  # The smoke check is what stops a green build from claiming a demo URL
  # that returns 5xx — the URL is the deliverable, not the revision.
  - id: promote-and-smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services update-traffic sahayakai-preview \
          --region=asia-southeast1 --project=$PROJECT_ID --to-latest --quiet
        url=$$(gcloud run services describe sahayakai-preview \
                 --region=asia-southeast1 --project=$PROJECT_ID \
                 --format="value(status.url)")
        fail=0
        for path in / /lesson-plan /quiz-generator /attendance /community; do
          code=$$(curl -s -o /dev/null -m 45 -w '%{http_code}' "$$url$$path")
          echo "  $$code $$url$$path"
          [ "$$code" = "200" ] || fail=1
        done
        exit $$fail
    waitFor: [deploy]

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# Hard cap so a hung build never blocks the queue forever.
timeout: 1800s

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/${_PROD_REGISTRY}/sahayakai-preview:$SHORT_SHA
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/${_PROD_REGISTRY}/sahayakai-preview:latest
