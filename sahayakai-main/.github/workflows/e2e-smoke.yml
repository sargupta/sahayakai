name: sahayakai-e2e-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: sahayakai-main

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: sahayakai-main

      - name: Run smoke + phone-overflow e2e tests
        run: npx playwright test --config=qa/playwright.config.ts qa/e2e/smoke.spec.ts qa/e2e/phone-overflow.spec.ts
        working-directory: sahayakai-main
