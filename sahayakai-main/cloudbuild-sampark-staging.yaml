# cloudbuild-sampark-staging.yaml — SamparkAI staging with real Riya calls over Vobiz.
#
# One non-production Cloud Run service, `sahayakai-sampark-staging`, wired to the Riya voice
# bridge (`sahayakai-riya-bridge`, sahayakai-agents/deploy/cloudbuild-riya-bridge.yaml):
#
#   Sampark console ──start──▶ Vobiz REST ──answer──▶ /api/webhooks/vobiz-riya/answer (here)
#        ▲                                                     │ <Stream> to the bridge
#        │                                                     ▼
#   call history ◀── /api/webhooks/vobiz-riya/event ◀── bridge (Riya on Gemini Live)
#                    /api/webhooks/vobiz-riya/context ──▶ (the bridge fetches the call's variables)
#
# Safety built in (same rules as cloudbuild-riya-staging.yaml):
#   - SAMPARK_FIRESTORE_DATABASE=sampark-nonprod: Riya refuses real calls without it.
#   - Test mode only (Live is refused in code); a call rings only the school's saved test phone,
#     which must also be in _TEST_NUMBERS (SAMPARK_RIYA_TEST_ALLOWED_NUMBERS). Empty = no real call.
#   - SAMPARK_RIYA_TEST_DAILY_CAP caps real test calls per school per day.
#   - Its own PII key, phone pepper and request-signing key (SAMPARK_STAGING_*), never production's.
#   - VOICE_PROVIDER is not set: the attendance parent-call path cannot dial from here.
#   - Scales to zero; max 1 instance.
#
# Submit (from the repo root; the upload is sahayakai-main only, about 50 MB):
#   gcloud builds submit sahayakai-main --project=sahayakai-b4248 --config=sahayakai-main/cloudbuild-sampark-staging.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD),_TEST_NUMBERS=+91XXXXXXXXXX

substitutions:
  _SERVICE: sahayakai-sampark-staging
  _REGISTRY: cloud-run-source-deploy
  _REGION: asia-southeast1
  _PROJECT_NUMBER: '640589855975'
  _BRIDGE_URL: https://sahayakai-riya-bridge-640589855975.asia-south1.run.app
  _TEST_NUMBERS: ''
  _DAILY_CAP: '3'
  _PURPOSES: ptm_invitation

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_SERVICE}:$SHORT_SHA
      - --build-arg=GIT_SHA=$SHORT_SHA
      - --build-arg=BUILD_ID=$BUILD_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=sahayakai-b4248-mumbai
      - --file=Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_SERVICE}:$SHORT_SHA']
    waitFor: [build]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --cpu=1
      - --memory=2Gi
      - --set-secrets=SAMPARK_PII_KEY=SAMPARK_STAGING_PII_KEY:latest,SAMPARK_PHONE_PEPPER=SAMPARK_STAGING_PHONE_PEPPER:latest,SAHAYAKAI_REQUEST_SIGNING_KEY=SAMPARK_STAGING_SIGNING_KEY:latest,VOBIZ_AUTH_ID=VOBIZ_AUTH_ID:latest,VOBIZ_AUTH_TOKEN=VOBIZ_AUTH_TOKEN:latest,VOBIZ_FROM_NUMBER=VOBIZ_FROM_NUMBER:latest,PROFILE_COMPLETE_COOKIE_SECRET=PROFILE_COMPLETE_COOKIE_SECRET:latest,FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest,GOOGLE_GENAI_API_KEY=GOOGLE_GENAI_API_KEY:latest
      - --set-env-vars=NODE_ENV=production,DEMO_MODE=true,SAMPARK_ENABLED=true,SAMPARK_ELEVENLABS_ENABLED=true,SAMPARK_LIVE_DIAL_ENABLED=true,SAMPARK_FIRESTORE_DATABASE=sampark-nonprod,SAMPARK_RIYA_PURPOSES=${_PURPOSES},SAMPARK_RIYA_TEST_DAILY_CAP=${_DAILY_CAP},SAMPARK_RIYA_TEST_ALLOWED_NUMBERS=${_TEST_NUMBERS},SAMPARK_VOBIZ_RIYA_ENABLED=true,SAMPARK_PUBLIC_BASE_URL=https://${_SERVICE}-${_PROJECT_NUMBER}.${_REGION}.run.app,VOBIZ_STREAM_BASE_URL=${_BRIDGE_URL},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=sahayakai-b4248-mumbai
      - --quiet
    waitFor: [push]
