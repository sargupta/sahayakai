openapi: 3.0.0
info:
  title: SahayakAI Virtual Field Trip API
  version: 1.0.0
  description: Plan immersive virtual field trips using Google Earth

servers:
  - url: http://localhost:3000
  - url: https://sahayakai.in

tags:
  - name: AI Generation

paths:
  /api/ai/virtual-field-trip:
    post:
      summary: Plan virtual field trip
      tags: [AI Generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic]
              properties:
                topic: {type: string, example: "The Great Barrier Reef"}
                gradeLevel: {type: string}
                language: {type: string}
            examples:
              reef:
                value:
                  topic: "Exploring the Great Barrier Reef"
                  gradeLevel: "Class 7"
                  language: "English"
      responses:
        '200':
          description: Field trip plan generated
          content:
            application/json:
              schema:
                type: object
                required: [stops]
                properties:
                  title: {type: string}
                  stops: {type: array, minItems: 1, items: {type: object}}
        '202':
          description: >
            Still generating. The dispatcher budget expired while the flow kept
            running; the trip lands in My Library. Carries no trip fields, so a
            client must branch on the status before reading the body.
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error: {type: string, enum: [still_generating]}
                  message: {type: string}
                  budgetMs: {type: integer}
                  elapsedMs: {type: integer}
      security: [{bearerAuth: []}]

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
