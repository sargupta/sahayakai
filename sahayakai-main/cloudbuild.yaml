# cloudbuild.yaml
#
# Single source of truth for the SahayakAI Cloud Run deploy pipeline.
# Triggered by `git push origin main` via the Cloud Build GitHub trigger
# `sahayakai-main-deploy` (see scripts/setup-build-trigger.sh).
#
# Steps:
#   1. Build the Docker image, tag it with both :latest and :<short-sha>.
#   2. Push both tags to Artifact Registry.
#   3. Deploy to Cloud Run with --no-traffic. The new revision is built
#      and held warm but does NOT auto-receive traffic. A human (or
#      release agent) flips it explicitly via:
#          gcloud run services update-traffic sahayakai-hotfix-resilience \
#              --region=asia-southeast1 --project=$PROJECT_ID --to-latest
#
# Why --no-traffic? Because two parallel pushes can race. If either
# auto-routed traffic on success, whichever finished last would clobber
# the other. With --no-traffic, both produce ready revisions and the
# operator picks the winner explicitly.
#
# Variables:
#   $PROJECT_ID  — provided by Cloud Build automatically
#   $SHORT_SHA   — provided by Cloud Build automatically (first 7 chars)
#   $_SERVICE    — substitution; set per trigger or default below. Used by
#                  scripts/safe-deploy.sh's build-in-flight guard to scope
#                  the ongoing-build check to a specific Cloud Run service,
#                  so a preview build does not block a prod deploy.

substitutions:
  _SERVICE: sahayakai-hotfix-resilience

steps:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  # `dir: sahayakai-main` is required: Cloud Build clones the WHOLE repo
  # to /workspace, so without this step's `dir`, --file=Dockerfile would
  # resolve to /workspace/Dockerfile (which doesn't exist — Dockerfile
  # lives at /workspace/sahayakai-main/Dockerfile).
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: sahayakai-main
    args:
      - build
      - --tag=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA
      - --tag=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:latest
      - --build-arg=GIT_SHA=$SHORT_SHA
      - --build-arg=GIT_SHA_FULL=$COMMIT_SHA
      - --build-arg=BUILD_ID=$BUILD_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=sahayakai-b4248-mumbai
      - --file=Dockerfile
      - .

  # ── 2. Push both tags ─────────────────────────────────────────────────────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA
    waitFor: [build]
  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:latest
    waitFor: [build]

  # ── 3. Deploy to Cloud Run, NO traffic ────────────────────────────────────
  # Tag the revision with the short sha so it is reachable directly at
  # https://dep-<sha>---<service>-<hash>.run.app for verification.
  # F1-04 fix (2026-06-06): Twilio credentials moved to Secret Manager.
  # `--update-secrets` is idempotent: it (re)binds the env var to a
  # Secret Manager version on every deploy, so the secret reference
  # survives even if a future operator runs an ad-hoc `gcloud run deploy`
  # that resets env. Plaintext TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN env
  # vars MUST NOT be reintroduced — they would be readable by any
  # principal holding `run.services.get`.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sahayakai-hotfix-resilience
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA
      - --region=asia-southeast1
      - --project=$PROJECT_ID
      - --no-traffic
      - --tag=sha-$SHORT_SHA
      - --update-secrets=TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,SAHAYAKAI_AGENTS_AUDIENCE=SAHAYAKAI_AGENTS_AUDIENCE:latest,PROFILE_COMPLETE_COOKIE_SECRET=PROFILE_COMPLETE_COOKIE_SECRET:latest,DEMO_CALL_PEPPER=DEMO_CALL_PEPPER:latest,DEMO_CALL_ENC_KEY=DEMO_CALL_ENC_KEY:latest
      # Sidecar URL — pinned to PROD service so a fresh deploy cannot
      # silently inherit a staging URL from a previous ad-hoc env override.
      # 2026-06-06 (parent-call attendance diagnosis): the live revision was
      # serving with NEXT_PUBLIC_SAHAYAKAI_AGENTS_URL pointing at the staging
      # sidecar — every parent-call turn fired the shadow-diff pair via
      # Promise.all and the sidecar leg burned its full timeout against
      # staging from prod before the dispatcher gave up, slowing the call.
      # The audience secret (verified at the sidecar) was also pointing at
      # staging. Both are now pinned at the deploy step. If you really need
      # to point preview/staging deploys at the staging sidecar, do that in
      # a SEPARATE Cloud Build trigger — never as an ad-hoc env override on
      # the prod service.
      # VIDYA_VOICE_LIVE_ENABLED: turns on Gemini Live voice via the
      # sidecar-mint path (start-session/route.ts). OFF everywhere else
      # (default 503 → turn-based STT/classifier/TTS fallback). Enabled
      # in prod 2026-08-13 alongside the revert to the sidecar-mint path.
      # DEMO_CALL_ENABLED: "Hear the Call" public lead magnet (/try-call →
      # /api/demo-call, real Twilio calls). Enabled in prod 2026-08-13.
      # DAILY_CAP=50 = conservative soft-launch spend ceiling (code default
      # is 500); raise once abuse patterns are understood. Pepper + enc-key
      # bound via --update-secrets above; Twilio creds already present.
      - --update-env-vars=NEXT_PUBLIC_SAHAYAKAI_AGENTS_URL=https://sahayakai-agents-zwydpvyuca-as.a.run.app,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=sahayakai-b4248-mumbai,VIDYA_VOICE_LIVE_ENABLED=true,DEMO_CALL_ENABLED=true,DEMO_CALL_DAILY_CAP=50
      - --quiet
    waitFor: [push-sha]

  # ── 3b. Mirror the image into the Mumbai registry ─────────────────────────
  # Each region has its own Artifact Registry, so a Singapore-only push left
  # Mumbai with nothing to deploy. That is why Mumbai sat on a 2026-08-13
  # build while Singapore moved on — the 11-day split-brain of 2026-08.
  - id: tag-mumbai
    name: gcr.io/cloud-builders/docker
    args: [tag, 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA', 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA']
    waitFor: [build]
  - id: push-mumbai
    name: gcr.io/cloud-builders/docker
    args: [push, 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA']
    waitFor: [tag-mumbai]

  # ── 4b. Deploy Mumbai, NO traffic ─────────────────────────────────────────
  # Identical secrets and env to Singapore. They had drifted: Mumbai was
  # missing DEMO_CALL_PEPPER / DEMO_CALL_ENC_KEY entirely, so the demo-call
  # feature was silently dead in one region only.
  - id: deploy-mumbai
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sahayakai-hotfix-resilience
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA
      - --region=asia-south1
      - --project=$PROJECT_ID
      - --no-traffic
      - --tag=sha-$SHORT_SHA
      - --update-secrets=TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,SAHAYAKAI_AGENTS_AUDIENCE=SAHAYAKAI_AGENTS_AUDIENCE:latest,PROFILE_COMPLETE_COOKIE_SECRET=PROFILE_COMPLETE_COOKIE_SECRET:latest,DEMO_CALL_PEPPER=DEMO_CALL_PEPPER:latest,DEMO_CALL_ENC_KEY=DEMO_CALL_ENC_KEY:latest
      - --update-env-vars=NEXT_PUBLIC_SAHAYAKAI_AGENTS_URL=https://sahayakai-agents-zwydpvyuca-as.a.run.app,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=sahayakai-b4248-mumbai,VIDYA_VOICE_LIVE_ENABLED=true,DEMO_CALL_ENABLED=true,DEMO_CALL_DAILY_CAP=50
      - --quiet
    waitFor: [push-mumbai]

  # ── 5. Smoke both tagged revisions BEFORE either takes traffic ────────────
  # The revision-scoped tag URL reaches the new build directly while live
  # traffic still sits on the old one, so a broken build never gets promoted.
  - id: smoke-both
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        fail=0
        for region in asia-southeast1 asia-south1; do
          url=$$(gcloud run services describe sahayakai-hotfix-resilience \
                   --region="$$region" --project=$PROJECT_ID \
                   --format="value(status.traffic)" 2>/dev/null \
                 | tr ';' '\n' | grep -F "sha-$SHORT_SHA" \
                 | grep -oE 'https://[^"'"'"']+' | head -1)
          if [ -z "$$url" ]; then
            echo "FAIL $$region: no tag URL for sha-$SHORT_SHA"; fail=1; continue
          fi
          code=$$(curl -s -o /dev/null -m 45 -w '%{http_code}' "$$url/api/health")
          echo "  $$region $$code $$url"
          [ "$$code" = "200" ] || fail=1
        done
        exit $$fail
    waitFor: [deploy, deploy-mumbai]

  # ── 6. Promote BOTH regions together ──────────────────────────────────────
  # Promotion was previously a manual step an operator had to remember for
  # each region separately. Forgetting one is precisely the split-brain, so
  # it is automated here and both flip in the same build.
  - id: promote-both
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # ── Stale-build guard ────────────────────────────────────────────
        # 2026-09-17: five PRs merged in quick succession started five
        # concurrent builds against this one service. Four failed with
        #   ABORTED: Conflict for resource 'sahayakai-hotfix-resilience':
        #   version 'X' was specified but current version is 'Y'
        # and, worse, every build had already created a revision, so the
        # build that happened to finish LAST won — which was not the newest
        # commit. Traffic follows latest, so production came up green while
        # serving neither old main nor new main. The site was healthy and
        # wrong, which is the hardest kind of wrong to notice.
        #
        # A build that is no longer the newest for this trigger has nothing
        # useful to promote: a newer one is on its way and will promote the
        # newer code. So it exits early rather than racing.
        #
        # This is NOT solved by promoting our own tagged revision instead of
        # --to-latest: pinning traffic to a named revision is what caused the
        # 11-day split-brain in August, where fresh revisions landed at 0%.
        # --to-latest stays; the guard is on who is allowed to call it.
        # NOTE: `2>/dev/null` on both gcloud calls below is load-bearing, not
        # tidiness. When the filter matches nothing gcloud prints
        #   WARNING: The following filter keys were not present in any resource
        # on stderr. Merging that into the result with 2>&1 makes `newer`
        # non-empty for EVERY build, so every build skips and nothing is ever
        # promoted again. Verified against real build history before shipping.
        mine=$$(gcloud builds describe $BUILD_ID --project=$PROJECT_ID \
                  --format='value(createTime)' 2>/dev/null || echo "")
        if [ -n "$$mine" ]; then
          newer=$$(gcloud builds list --project=$PROJECT_ID --limit=20 \
                    --filter="substitutions.TRIGGER_NAME=$TRIGGER_NAME AND createTime>\"$$mine\" AND (status=SUCCESS OR status=WORKING OR status=QUEUED)" \
                    --format='value(id)' 2>/dev/null | head -1)
          if [ -n "$$newer" ]; then
            echo "SKIP PROMOTE: build $$newer is newer than this one ($BUILD_ID)."
            echo "It will promote the newer commit. Exiting 0 so this build does"
            echo "not overwrite newer code with older."
            echo
            echo "If that newer build then FAILS, nothing gets promoted and prod"
            echo "stays on the previous revision — safe, but the new code is not"
            echo "live. Re-run this trigger on main to deploy it."
            exit 0
          fi
        else
          echo "WARN: could not read this build's createTime; promoting without"
          echo "the stale-build guard. Check Cloud Build permissions."
        fi

        # ── Promote, retrying the optimistic-concurrency conflict ─────────
        # update-traffic sends the resource version it read. If anything else
        # touched the service in between, Cloud Run returns ABORTED. That is
        # transient and safe to retry; other errors are not, so they fail.
        for region in asia-southeast1 asia-south1; do
          for attempt in 1 2 3 4 5; do
            if out=$$(gcloud run services update-traffic sahayakai-hotfix-resilience \
                        --region="$$region" --project=$PROJECT_ID --to-latest --quiet 2>&1); then
              echo "  $$region promoted (attempt $$attempt)"
              break
            fi
            if ! echo "$$out" | grep -q "ABORTED"; then
              echo "$$out"; exit 1
            fi
            if [ "$$attempt" = "5" ]; then
              echo "  $$region: still conflicting after 5 attempts"; echo "$$out"; exit 1
            fi
            echo "  $$region: conflict, retrying in $$((attempt * 5))s"
            sleep $$((attempt * 5))
          done
        done
    waitFor: [smoke-both]

  # ── 7. Parity gate — the build fails if the regions disagree ──────────────
  # Next.js keys static chunks on a per-build hash, so two regions serving
  # different builds means a user gets HTML from one and 404s its chunks on
  # the other. Comparing the served hash is the direct test for that.
  - id: parity-gate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        hashes=""
        for region in asia-southeast1 asia-south1; do
          base=$$(gcloud run services describe sahayakai-hotfix-resilience \
                    --region="$$region" --project=$PROJECT_ID \
                    --format="value(status.url)")
          h=$$(curl -s -m 45 "$$base/" | grep -o 'webpack-[a-z0-9]*\.js' | head -1)
          echo "  $$region -> $${h:-UNREACHABLE}"
          hashes="$$hashes $$h"
        done
        uniq_count=$$(echo $$hashes | tr ' ' '\n' | grep -v '^$$' | sort -u | wc -l)
        if [ "$$uniq_count" != "1" ]; then
          echo "PARITY FAIL: regions are serving different builds"; exit 1
        fi
        echo "PARITY OK"
    waitFor: [promote-both]


# Build options
options:
  # Use higher-CPU machine to keep Next.js build under 10 min.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  # Avoid concurrent builds for the same trigger — Cloud Build will
  # queue subsequent invocations rather than running them in parallel.
  # (Setting CONCURRENCY=1 happens at the trigger level, not here.)

# Hard cap so a hung build never blocks the queue forever.
timeout: 3000s

# Image list for Cloud Build artifact tracking.
images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:latest
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sahayakai-hotfix-resilience:$SHORT_SHA
