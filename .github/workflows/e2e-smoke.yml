name: E2E Smoke

# Public-route Playwright smoke gate. Builds the app with stub secrets (the
# same pattern the unit Test Suite uses), boots `next start`, and runs ONLY
# the @smoke suite (qa/e2e/smoke.spec.ts) against public routes that render
# without real auth. Deeper authenticated flows need a provisioned test tenant
# and are intentionally out of scope here — see qa/HARNESS.md.

on:
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Pinned, never ubuntu-latest: Playwright supports only the OS images it
    # was released for. On 2026-10-22 ubuntu-latest moved to 26.04 and
    # `playwright install --with-deps` refused it, failing every PR before a
    # test ran. Move this pin when Playwright supports the newer image
    # (gate: src/__tests__/scripts/workflow-playwright-runner-pinned.test.ts).
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: sahayakai-main

    env:
      # Stub env vars so `next build` doesn't fail on missing secrets.
      # Mirrors the Build step in test.yml.
      GOOGLE_GENAI_API_KEY: stub
      GOOGLE_CLOUD_PROJECT: stub
      NEXT_PUBLIC_FIREBASE_API_KEY: stub
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: stub
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: stub
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: stub
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: stub
      NEXT_PUBLIC_FIREBASE_APP_ID: stub
      # Point Playwright at the locally-booted server and have its config
      # start `next start` for us (see qa/playwright.config.ts webServer guard).
      QA_BASE_URL: http://127.0.0.1:3000
      QA_START_SERVER: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sahayakai-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `--with-deps` runs `apt-get update`, which fails the whole step if ANY
      # source the runner image ships is unreachable. On 2026-10-23
      # packages.microsoft.com answered 403 ("no longer signed") and E2E Smoke
      # failed before a test ran. Playwright needs only Ubuntu's own archive, so
      # drop the image's third-party sources first
      # (gate: src/__tests__/scripts/ci-build-heap-parity.test.ts).
      - name: Drop the runner image's third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run @smoke suite
        # Playwright's webServer block boots `next start` on :3000 and waits
        # for it before the specs run. Path-target the smoke file AND grep
        # @smoke so only public-route smoke tests execute.
        run: npm run qa:e2e -- qa/e2e/smoke.spec.ts --grep @smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: sahayakai-main/qa/results/playwright-report/
          retention-days: 7
