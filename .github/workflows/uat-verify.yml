# UAT verification gate. After a push to main (or on manual dispatch), waits
# for the UAT environment to serve the target SHA, then fans out three probes
# — authenticated E2E, visual regression + axe, and a k6 smoke profile — and
# folds the results into a single `uat/verified` commit status.
#
# MERGE ORDER: PR #114 (release pipelines) must merge BEFORE this gate can go
# green — it ships both (a) the unauthenticated `gitSha` short-SHA field on
# /api/health that wait-for-uat polls, and (b) the PROFILE=smoke mode for
# launch-wall.js that k6-probe requires.
#
# Requirements wired elsewhere:
#   - vars.UAT_BASE_URL          (repo variable) — UAT origin, no trailing slash.
#   - vars.UAT_K6_ENABLED        (repo variable) — 'true' enables the k6 probe.
#     Absent/other → job skipped (report treats var-skip as success-equivalent).
#     T2 flips it on after #114's smoke profile is confirmed on main.
#   - secrets.QA_FIREBASE_SA_KEY — Firebase Admin SA JSON for the QA harness.
#     Absent → the e2e-auth steps skip with a neutral notice (T2 wires it).
#
# Concurrency note: cancel-in-progress means rapid successive pushes to main
# cancel the in-flight run, so intermediate SHAs never receive a `uat/verified`
# status. Intended: the gate always tracks the LATEST push; superseded commits
# are not individually verified.

name: UAT Verify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full git SHA expected live on UAT (defaults to the ref HEAD)'
        required: false
        type: string
      update_snapshots:
        description: 'Regenerate visual baselines (--update-snapshots) and upload them as an artifact instead of comparing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: uat-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  UAT_BASE_URL: ${{ vars.UAT_BASE_URL }}
  TARGET_SHA: ${{ github.event.inputs.sha || github.sha }}

jobs:
  wait-for-uat:
    name: Wait for UAT rollout
    runs-on: ubuntu-latest
    # Poll budget: 40 tries x (10s curl max + 30s sleep) ≈ 27 min worst case,
    # so the loop exhausts and emits its own ::error BEFORE the job timeout.
    timeout-minutes: 32
    steps:
      # /api/health exposes `gitSha` (the 7-char Cloud Build $SHORT_SHA) to
      # UNAUTHENTICATED callers — added by PR #114 (see MERGE ORDER above).
      # gitShaFull stays auth-gated, so we prefix-match the short SHA against
      # the 40-char target.
      - name: Poll /api/health until the target SHA is live
        run: |
          set -euo pipefail
          if [ -z "${UAT_BASE_URL:-}" ]; then
            echo "::error::Repo variable UAT_BASE_URL is not set"
            exit 1
          fi
          echo "Waiting for $TARGET_SHA on $UAT_BASE_URL (40 tries x 30s)"
          for i in $(seq 1 40); do
            deployed=$(curl -fsS --max-time 10 "$UAT_BASE_URL/api/health" \
              | jq -r '.gitSha // empty' || true)
            echo "try $i/40: deployed=${deployed:-<none>}"
            # Match: non-empty, not the local-build placeholder, >= 7 chars,
            # and a prefix of the full target SHA.
            if [ -n "$deployed" ] && [ "$deployed" != "local" ] && [ "${#deployed}" -ge 7 ]; then
              case "$TARGET_SHA" in
                "$deployed"*)
                  echo "UAT is serving $deployed (prefix of $TARGET_SHA)"
                  exit 0
                  ;;
              esac
            fi
            sleep 30
          done
          echo "::error::UAT never reported a short SHA matching $TARGET_SHA after 40 tries (~27 min). Check the UAT deploy pipeline, and that PR #114's public gitSha health field is live."
          exit 1

  e2e-auth:
    name: Authenticated E2E
    needs: wait-for-uat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sahayakai-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Job-level `if:` cannot read secrets, so gate every subsequent step on
      # this output instead. With the secret absent the job "runs" but every
      # step no-ops, leaving the job green — the report job treats that the
      # same as skipped.
      - name: Check for QA_FIREBASE_SA_KEY
        id: guard
        env:
          QA_FIREBASE_SA_KEY: ${{ secrets.QA_FIREBASE_SA_KEY }}
        run: |
          if [ -n "$QA_FIREBASE_SA_KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::QA_FIREBASE_SA_KEY is not configured — authenticated E2E skipped (T2 wires this secret)."
          fi

      - name: Setup Node 20
        if: steps.guard.outputs.have_key == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sahayakai-main/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.have_key == 'true'
        run: npm ci

      - name: Install Playwright browser (chromium only)
        if: steps.guard.outputs.have_key == 'true'
        run: npx playwright install --with-deps chromium

      - name: Provision test user + storage state
        if: steps.guard.outputs.have_key == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.QA_FIREBASE_SA_KEY }}
        run: |
          set -euo pipefail
          out=$(node scripts/qa/playwright-storage-state.mjs \
            --plan=premium --role=teacher --baseUrl="$UAT_BASE_URL")
          storage_state=$(echo "$out" | jq -r '.storageStatePath')
          uid=$(echo "$out" | jq -r '.uid')
          echo "Provisioned QA user uid=$uid"
          echo "QA_STORAGE_STATE=$storage_state" >> "$GITHUB_ENV"

      - name: Run authenticated harness suite against UAT
        if: steps.guard.outputs.have_key == 'true'
        env:
          QA_BASE_URL: ${{ vars.UAT_BASE_URL }}
        run: npm run qa:e2e -- qa/tests/

      - name: Cleanup test users
        if: always() && steps.guard.outputs.have_key == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.QA_FIREBASE_SA_KEY }}
        run: node scripts/qa/cleanup-test-users.mjs

      - name: Upload Playwright report
        if: failure() && steps.guard.outputs.have_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth-report
          path: sahayakai-main/qa/results/playwright-report/
          retention-days: 7

  visual:
    name: Visual regression + axe
    needs: wait-for-uat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sahayakai-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sahayakai-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @visual suite against UAT
        env:
          QA_BASE_URL: ${{ vars.UAT_BASE_URL }}
          UPDATE_SNAPSHOTS: ${{ github.event.inputs.update_snapshots }}
        run: |
          extra=""
          if [ "${UPDATE_SNAPSHOTS:-false}" = "true" ]; then
            extra="--update-snapshots"
            echo "::notice::Baseline-refresh run: regenerating linux snapshots instead of comparing."
          fi
          npm run qa:e2e -- qa/e2e/visual.spec.ts --grep @visual $extra

      # Baseline-refresh runs upload the regenerated linux snapshots; download
      # this artifact and commit its contents to qa/e2e/__screenshots__/.
      # See qa/HARNESS.md "Visual Regression".
      - name: Upload regenerated baselines
        if: github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: sahayakai-main/qa/e2e/__screenshots__/
          retention-days: 14

      - name: Upload Playwright report + diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-and-diffs
          path: |
            sahayakai-main/qa/results/playwright-report/
            sahayakai-main/qa/results/playwright-output/
          retention-days: 14

  k6-probe:
    name: k6 smoke probe
    needs: wait-for-uat
    # Gate 1: opt-in repo variable. Absent/false → job SKIPPED (the report job
    # treats a var-skip as success-equivalent). T2 sets UAT_K6_ENABLED='true'
    # only after PR #114's PROFILE=smoke lands on main — never enable before,
    # or the script's default is the full 400-VU morning-wall ramp.
    if: vars.UAT_K6_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate 2 (belt-and-braces): k6 silently ignores unknown -e vars, so if
      # the smoke profile is not implemented in launch-wall.js yet,
      # `-e PROFILE=smoke` would degrade to the full wall ramp without any
      # error. Refuse to run unless the script provably reads PROFILE.
      - name: Verify launch-wall.js supports PROFILE selection
        run: |
          if ! grep -q '__ENV\.PROFILE' sahayakai-main/scripts/loadtest/launch-wall.js; then
            echo "::error::launch-wall.js does not read __ENV.PROFILE — the smoke profile (PR #114) is not on this ref. Refusing to run: without it, k6 would fire the full 400-VU morning-wall ramp."
            exit 1
          fi

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke profile against UAT
        run: |
          k6 run -e PROFILE=smoke -e BASE_URL="$UAT_BASE_URL" \
            sahayakai-main/scripts/loadtest/launch-wall.js

  report:
    name: Post uat/verified status
    # wait-for-uat is in needs so its result is directly observable: if it
    # failed, every probe is dependency-SKIPPED — treating those skips as
    # passes would rubber-stamp a commit with ZERO tests run.
    needs: [wait-for-uat, e2e-auth, visual, k6-probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # State matrix:
      #   wait-for-uat != success            → failure (probes never ran).
      #   e2e-auth must be 'success' outright — the secret-absent case is
      #     implemented as job SUCCESS with a ::notice (step-level guard), so
      #     'skipped' here can only mean dependency-skip → failure.
      #   visual must be 'success' outright — same reasoning.
      #   k6-probe may be 'success' OR 'skipped': job-level
      #     `if: vars.UAT_K6_ENABLED == 'true'` skips it intentionally when
      #     the var is unset. But wait-for-uat==success is required first, so
      #     a dependency-skip can never masquerade as a var-skip. A k6 job
      #     that RAN and failed → failure.
      - name: Compute state and post commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_RESULT: ${{ needs.wait-for-uat.result }}
          E2E_RESULT: ${{ needs.e2e-auth.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          K6_RESULT: ${{ needs.k6-probe.result }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$WAIT_RESULT" = "success" ] \
            && [ "$E2E_RESULT" = "success" ] \
            && [ "$VISUAL_RESULT" = "success" ] \
            && { [ "$K6_RESULT" = "success" ] || [ "$K6_RESULT" = "skipped" ]; }; then
            state=success
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "uat/verified → $state (uat:$WAIT_RESULT e2e:$E2E_RESULT visual:$VISUAL_RESULT k6:$K6_RESULT) for $TARGET_SHA"
          gh api "repos/${{ github.repository }}/statuses/$TARGET_SHA" \
            -f state="$state" \
            -f context="uat/verified" \
            -f description="uat:$WAIT_RESULT e2e:$E2E_RESULT visual:$VISUAL_RESULT k6:$K6_RESULT" \
            -f target_url="$run_url"
