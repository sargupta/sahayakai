name: Flutter CI

# The Flutter app had NO CI at all until 2026-08-17. An audit that day found
# `grep -ril flutter .github/workflows/` returned zero matches, while
# quality-gates.yml scoped its diff to sahayakai-main/src/** and triggered only
# on develop/main — so 182 commits of Android work had never been touched by an
# automated check. Every gate was a local script somebody remembered to run.
#
# This runs the same ladder the loop harness runs locally
# (scripts/loop/gate.sh), so a green run here means the same thing a green
# local gate means.

on:
  push:
    # `feature/flutter-rebuild` merged into main and was deleted, which left this
    # trigger pointing at a ref that no longer exists — so from that merge until
    # 2026-09-27 nothing ran post-merge and the Flutter app's only automated
    # check was the pull_request one. Follow the trunk instead of a branch that
    # can be deleted under us.
    branches: [main]
    paths:
      - 'sahayakai-flutter/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sahayakai-flutter/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Re-baseline the golden PNGs on Linux and upload them as an artifact.
          Flutter goldens are NOT portable across host platforms: baselines
          generated on a developer Mac will not match ubuntu-latest. CI is the
          sole authority, and this input is how its baselines get established.
          The new PNGs arrive as a downloadable artifact for a human to commit
          through a pull request — this job no longer writes to the repository.
        type: boolean
        default: false

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sahayakai-flutter

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  analyze:
    name: 'Gate 1: codegen, analyze, tokens, i18n'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get

      # Codegen must be IDEMPOTENT, not merely equal to HEAD: a unit whose job
      # is committing regenerated output would fail a HEAD comparison by
      # definition. Run the generator; nothing further may change.
      - name: codegen is idempotent
        run: |
          before=$(find lib -name '*.g.dart' -exec shasum {} + | shasum)
          dart run build_runner build --delete-conflicting-outputs
          after=$(find lib -name '*.g.dart' -exec shasum {} + | shasum)
          if [ "$before" != "$after" ]; then
            echo "::error::source and generated output disagree — run build_runner and commit"
            git status --porcelain -- ':(glob)lib/**/*.g.dart'
            exit 1
          fi

      - name: analyze
        run: flutter analyze

      - name: token guard
        run: bash scripts/token_guard.sh

      # The check gen-l10n structurally cannot do. It does not fail on a missing
      # key — it bakes the ENGLISH string into the generated locale class, which
      # is how 4,760 strings went missing while analyze and 1,750 tests stayed
      # green.
      - name: i18n audit (11 locales, 5 checks)
        run: python3 scripts/loop/i18n_audit.py

      # The loop selftest proves the AUTONOMOUS-LOOP guards can fail, and those
      # guards are bound to the loop's own branch and ledger: loop_guard requires
      # the branch be `feature/flutter-rebuild`, and reconcile validates that
      # branch's verifiedAtSha ledger. They cannot pass on a PR branch by design,
      # so this meta-check runs only on the loop branch, where it is meaningful.
      # The real code gates above (codegen, analyze, tokens, i18n) still run on
      # every PR.
      - name: guards can still fail
        if: github.ref == 'refs/heads/feature/flutter-rebuild'
        run: bash scripts/loop/selftest.sh

  test:
    name: 'Gate 2: unit + widget tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Goldens are excluded here and owned by their own job: they are the only
      # rung whose result depends on the host platform.
      - name: test
        run: flutter test --reporter expanded --exclude-tags golden

  goldens:
    name: 'Gate 3: golden baselines (Linux is the authority)'
    runs-on: ubuntu-latest
    # Read-only on purpose. This job used to commit and push the baselines it
    # rendered; it now hands them back as an artifact, so it has no reason to
    # hold a write-capable token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # A commit-back needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: re-baseline on Linux
        if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
        run: flutter test --tags golden --update-goldens

      - name: report what re-baselining changed
        if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
        run: |
          # The previous version of this step committed and pushed the new PNGs
          # itself, and it was allowed to write only to feature/rebuild — a
          # branch that has since been merged and deleted. So the one mechanism
          # for establishing baselines could not run at all, and the golden gate
          # stayed red with no way to fix it in the sanctioned path.
          #
          # CI no longer writes to the repository. It re-renders on the authority
          # platform and hands the bytes back; a human lands them through a pull
          # request like any other change.
          if git diff --quiet -- test/golden docs/flutter/spike; then
            echo 'goldens already match this platform — nothing to re-baseline'
          else
            git -c core.pager=cat diff --stat -- test/golden docs/flutter/spike
          fi

      - name: upload re-baselined goldens
        if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
        uses: actions/upload-artifact@v4
        with:
          name: rebaselined-goldens
          # Both trees hold committed baselines: the widget goldens under
          # test/golden, and the PDF Indic-shaping spike's reference render
          # under docs/flutter/spike.
          path: |
            sahayakai-flutter/test/golden
            sahayakai-flutter/docs/flutter/spike
          if-no-files-found: error

      - name: verify goldens
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_goldens) }}
        run: flutter test --tags golden

      # Without this a golden failure is unreadable: the diff exists only as a
      # file in the runner's workspace.
      - name: upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: sahayakai-flutter/test/**/failures/*.png
          if-no-files-found: ignore

  build:
    name: 'Gate 4: debug APK'
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # analyze and test run the analysis server and the test VM. Neither
      # compiles the release kernel snapshot or invokes Gradle. This repo has
      # already lost a build to that blind spot: record 5.2.1 capped
      # record_linux below 1.0.0, resolving a stale sibling whose hasPermission
      # signature no longer matched the platform interface. Analyze was clean,
      # every test was green, and `flutter build apk` was broken.
      - name: build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: sahayakai-flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
