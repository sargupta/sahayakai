<!-- @dsCard group="Screens · Outputs" height=800 width=400 page="true" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Exam paper</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
function SectionHead(props) {
  return h('h2', { style: { margin: 0, display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10 } },
    h('span', { style: { font: '600 12px/normal var(--font-display)', minWidth: 0 } }, props.title),
    h('span', { style: { font: '600 12px/normal var(--font-ui)', color: 'var(--text-body)', whiteSpace: 'nowrap' } }, props.marks));
}
function Exam() {
  return h(S.PhoneScreen, {
    gap: 10,
    overlay: [
      h('div', { key: 'o', className: 'sk-orb-park sk-orb-park--cta' }, h(S.Orb, { onClick: function () {} })),
      h('div', { key: 't', className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'library' }))
    ]
  },
    h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
      h(S.ScreenHeader, { onBack: function () {}, backLabel: 'Back to Library', style: { marginTop: 6 } }),
      h(S.Pill, { tone: 'glass', size: 'md', style: { fontSize: 12, padding: '8px 13px', color: 'var(--text-strong)' } }, '3 hours · 80 marks')),
    h('div', null,
      h(S.Eyebrow, { tone: 'muted', style: { letterSpacing: '.18em' } }, 'Exam paper · CBSE blueprint'),
      h(S.ScreenHeader, { level: 'page', title: 'CBSE Class 10 Mathematics Sample Paper', subtitle: 'All questions are compulsory · internal choice in Sections B to E', style: { marginTop: 4 } })),
    h(S.ActionBar, { set: 'revise', size: 'md', bleed: true, label: 'Exam paper actions' }),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
      h(SectionHead, { title: 'Section A · Multiple choice', marks: '20 marks' }),
      h(S.QuizQuestion, { variant: 'exam', number: 1, pyq: 'Past paper · 1 mark', question: 'If HCF(a, 12) = 4 and LCM(a, 12) = 60, then a is', options: ['16', '20', '24', '30'], correct: 1 })),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
      h(SectionHead, { title: 'Section C · Short answer', marks: '18 marks' }),
      h(S.QuizQuestion, { variant: 'exam', type: 'short', number: 31, marks: '3 marks', question: 'Prove that √5 is irrational.', or: 'find the HCF and LCM of 510 and 92.', scheme: 'Marking scheme · 1 + 1 + 1' })),
    h('div', { style: { flex: 1, minHeight: 0 } }),
    h('div', { role: 'group', 'aria-label': 'CBSE blueprint', style: { display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 33 } },
      h(S.Pill, { tone: 'saffron' }, 'Number systems 6'),
      h(S.Pill, { tone: 'leaf' }, 'Algebra 20'),
      h(S.Pill, { tone: 'indigo' }, '5 sections')),
    h('div', { style: { display: 'flex', gap: 9 } },
      h(S.Button, { variant: 'primary', size: 'md', style: { flex: 1 } }, 'Print paper'),
      h(S.Button, { variant: 'secondary', size: 'md' }, 'Answer key')));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(Exam)));
</script>
</body></html>
