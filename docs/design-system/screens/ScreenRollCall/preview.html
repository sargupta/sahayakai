<!-- @dsCard group="Screens · Class and calls" height=800 width=400 page="true" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Roll call</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
function RollCall() {
  var st = React.useState({ 1: 'present', 2: 'present', 3: 'unmarked', 12: 'late', 19: 'absent' }), marks = st[0], setMarks = st[1];
  function mark(n) { return function (v) { var m = Object.assign({}, marks); m[n] = v; setMarks(m); }; }
  var present = 34;
  return h(S.PhoneScreen, {
    gap: 11, glow: false,
    overlay: [
      h('div', { key: 'o', className: 'sk-orb-park sk-orb-park--left sk-orb-park--cta' }, h(S.Orb, { onClick: function () {} })),
      h('div', { key: 't', className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'home' }))
    ]
  },
    h(S.ScreenHeader, { level: 'page', align: 'end', title: 'Class 7 · roll call', subtitle: 'Fri 18 Sept · 38 students', trailing: h(S.Pill, { tone: 'solid-leaf', size: 'md' }, present + ' present') }),
    h(S.GlassCard, { padding: '13px 14px', style: { flexDirection: 'row', alignItems: 'center', gap: 11 } },
      h('span', { 'aria-hidden': 'true', style: { width: 34, height: 34, borderRadius: 'var(--radius-pill)', background: 'var(--saffron-500)', color: 'var(--text-on-accent)', flex: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'micpulse 2.2s ease-in-out infinite' } }, h(S.Icon, { name: 'mic', size: 16 })),
      h('div', null, h('div', { style: { font: '600 13px/1.3 var(--font-display)' } }, 'Read the names aloud'), h('div', { style: { font: '400 12px/1.4 var(--font-ui)', color: 'var(--text-body)' } }, 'I mark each one as you say it'))),
    h('ol', { style: { listStyle: 'none', margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: 7, flex: 1, minHeight: 0, overflow: 'hidden' } },
      h(S.RosterRow, { number: 1, name: 'Aarav Sharma', status: marks[1], onMark: mark(1) }),
      h(S.RosterRow, { number: 2, name: 'Ananya Iyer', status: marks[2], onMark: mark(2) }),
      h(S.RosterRow, { number: 3, name: 'Bhavna Patil', status: marks[3], current: true, onMark: mark(3) }),
      h(S.RosterRow, { number: 12, name: 'Uma Krishnan', status: marks[12], onMark: mark(12) }),
      h(S.RosterRow, { number: 19, name: 'Dhruv Chauhan', status: marks[19], onMark: mark(19) })),
    h(S.Button, { block: true, variant: 'success' }, 'Submit attendance'));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(RollCall)));
</script>
</body></html>
