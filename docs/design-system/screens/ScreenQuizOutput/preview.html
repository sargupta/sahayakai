<!-- @dsCard group="Screens · Outputs" height=800 width=400 page="true" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quiz output</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
function Quiz() {
  var k = React.useState(true), key = k[0], setKey = k[1];
  var d = React.useState('medium'), level = d[0], setLevel = d[1];
  return h(S.PhoneScreen, {
    gap: 8,
    overlay: [
      h('div', { key: 'o', className: 'sk-orb-park sk-orb-park--cta' }, h(S.Orb, { onClick: function () {} })),
      h('div', { key: 't', className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'library' }))
    ]
  },
    h(S.ScreenHeader, { level: 'output', title: 'Water’s Journey: Understanding the Water Cycle' }),
    h('div', { style: { display: 'flex', gap: 5, flexWrap: 'wrap' } },
      h(S.Pill, { tone: 'leaf' }, 'Class 6'),
      h(S.Pill, { tone: 'leaf' }, '5 questions'),
      h(S.Pill, { tone: 'indigo' }, 'CBSE · Curiosity 6, Ch 8')),
    h(S.SegmentedControl, { label: 'Difficulty', value: level, onChange: setLevel, options: [{ value: 'easy', label: 'Easy' }, { value: 'medium', label: 'Medium' }, { value: 'hard', label: 'Hard' }] }),
    h(S.ActionBar, {
      label: 'Quiz actions', bleed: true,
      actions: [{ key: 'answer-key', label: 'Answer key', icon: 'key', pressed: key, onClick: function () { setKey(!key); } }, 'edit', 'regenerate', 'download', 'share']
    }),
    h(S.QuizQuestion, { number: 1, layout: 'grid', collapsible: true, reveal: key, question: 'What do we call water turning into vapour, like wet clothes drying in the sun?', options: ['Condensation', 'Precipitation', 'Evaporation', 'Collection'], correct: 2 }),
    h(S.QuizQuestion, { number: 2, type: 'short', collapsible: true, answerArea: true, question: 'What term describes water falling back to Earth as rain, snow or hail?', style: { flex: 1, minHeight: 0, overflow: 'hidden' } }),
    h('div', { style: { minHeight: 56, display: 'flex', alignItems: 'center', marginBottom: 17 } }, h(S.FeedbackRow, { align: 'start' })),
    h('div', { style: { display: 'flex', gap: 9 } },
      h(S.Button, { variant: 'primary', size: 'md', style: { flex: 1 } }, 'Deliver'),
      h(S.Button, { variant: 'secondary', size: 'md' }, 'Share to Community')));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(Quiz)));
</script>
</body></html>
