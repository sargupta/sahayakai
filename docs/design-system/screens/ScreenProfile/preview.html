<!-- @dsCard group="Screens · Library and you" height=800 width=400 page="true" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>You</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
function Profile() {
  var l = React.useState(true), left = l[0], setLeft = l[1];
  return h(S.PhoneScreen, {
    network: 'no signal', gap: 11, glow: false,
    overlay: [
      h(S.OrbHint, { key: 'o', parked: true, side: 'left', state: 'offline', label: 'Typing still works', onClick: function () {} }),
      h('div', { key: 't', className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'profile' }))
    ]
  },
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 11 } },
      h(S.Avatar, { name: 'Meena Kulkarni', initials: 'MK', size: 'lg' }),
      h('div', null, h('h1', { style: { margin: 0, font: '700 18px/1.2 var(--font-display)' } }, 'Meena Kulkarni'), h('div', { style: { font: '400 12px/1.4 var(--font-ui)', color: 'var(--text-body)' } }, 'Green Valley Public School, Nashik · Classes 5 & 7'))),
    h(S.NoticeCard, { tone: 'saffron', title: 'Working offline', role: 'status' }, 'Voice needs signal. Typing, roll call and saved work keep going. I’ll send the rest when you’re back.'),
    h(S.Eyebrow, { tone: 'muted' }, '3 items queued'),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
      h(S.TaskRow, { variant: 'boxed', dot: 'amber', label: 'Attendance · Class 7', meta: 'waiting', statusLabel: 'queued' }),
      h(S.TaskRow, { variant: 'boxed', dot: 'amber', label: 'Worksheet to parent group', meta: 'waiting', statusLabel: 'queued' }),
      h(S.TaskRow, { variant: 'boxed', dot: 'amber', label: 'Call log · Dhruv’s father', meta: 'waiting', statusLabel: 'queued' })),
    h(S.GlassCard, { padding: '13px 14px', gap: 8, style: { flex: 1, minHeight: 0 } },
      h('div', { style: { font: '600 12px/1.3 var(--font-ui)' } }, 'Settings'),
      h(S.SettingsRow, { label: 'Language · हिन्दी', action: 'Change', onAction: function () {} }),
      h(S.SettingsRow, { label: 'Board · CBSE', action: 'Change', onAction: function () {} }),
      h(S.SettingsRow, { label: 'Orb on the left hand', control: h(S.Switch, { label: 'Orb on the left hand', hideLabel: true, checked: left, onChange: setLeft }) }),
      h(S.SettingsRow, { label: 'Download for offline', action: '24 items', onAction: function () {} })));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(Profile)));
</script>
</body></html>
