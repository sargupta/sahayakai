<!-- @dsCard group="Screens · Make" height=800 width=400 page="true" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Worksheet wizard</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
var IDEAS = [
  'From this page, create 5 fill-in-the-blanks',
  'A “Match the following” from the animal names',
  'A word search of the hard words on this page'
];
function Worksheet() {
  var p = React.useState(null), page = p[0], setPage = p[1];
  var i = React.useState('6 fill-in-the-blank questions on the parts of a plant, with an answer key.'), ask = i[0], setAsk = i[1];
  var s = React.useState(null), idea = s[0], setIdea = s[1];
  var m = React.useState('idle'), mic = m[0], setMic = m[1];
  var ready = !!page;
  return h(S.PhoneScreen, {
    gap: 9,
    overlay: [
      h('div', { key: 'o', className: 'sk-orb-park sk-orb-park--left', style: { bottom: 'calc(var(--orb-park-bottom) - 6px)' } }, h(S.Orb, { onClick: function () {} })),
      h('div', { key: 't', className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'library' }))
    ]
  },
    h(S.ScreenHeader, { level: 'page', title: 'Make a worksheet', subtitle: 'Photograph a page, then say what to make from it' }),
    h(S.UploadDrop, { label: 'Textbook page', required: true, file: page, error: 'Add a photo of the textbook page to continue.', onFile: function (f) { setPage({ name: f.name, meta: 'Photo · ' + (f.size / 1048576).toFixed(1) + ' MB' }); }, onRemove: function () { setPage(null); } }),
    h(S.Field, { label: 'Worksheet instructions', size: 'md', multiline: true, rows: 2, value: ask, onChange: function (e) { setAsk(e.target.value); }, mic: mic, onMic: function () { setMic(mic === 'idle' ? 'listening' : 'idle'); } }),
    h('div', { role: 'radiogroup', 'aria-label': 'Ideas for this page', className: 'sk-suggestionrow-group' },
      IDEAS.map(function (t, k) { return h(S.SuggestionRow, { key: k, selected: idea === k, tabIndex: idea === k || (idea === null && k === 0) ? 0 : -1, onSelect: function () { setIdea(k); setAsk(t); } }, t); })),
    h('div', { style: { display: 'flex', gap: 7 } },
      h(S.Field, { label: 'Class', size: 'md', as: 'select', value: 'Class 3', style: { flex: '1.05 1 0' } }),
      h(S.Field, { label: 'Subject', size: 'md', as: 'select', value: 'EVS', style: { flex: '.85 1 0' } }),
      h(S.Field, { label: 'Language', size: 'md', as: 'select', value: 'English', style: { flex: '1.1 1 0' } })),
    h(S.GlassCard, { tone: 'soft', style: { flex: 1, minHeight: 0, alignItems: 'center', justifyContent: 'center', gap: 5, textAlign: 'center' } },
      h('div', { style: { font: '600 12px/1.3 var(--font-display)', color: 'var(--text-body)' } }, 'Your result will appear here'),
      h('div', { id: 'ws-reason', style: { font: '400 12px/1.45 var(--font-ui)', color: 'var(--text-muted)' } }, ready ? 'Ready when you are. Tap Generate.' : 'Add the page photo, then tap Generate.')),
    h('div', { style: { display: 'flex', gap: 10, paddingLeft: 64 } },
      h(S.Button, { block: true, style: { flex: 1, minWidth: 0 }, 'aria-disabled': ready ? undefined : true, 'aria-describedby': 'ws-reason' }, 'Generate worksheet')));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(Worksheet)));
</script>
</body></html>
