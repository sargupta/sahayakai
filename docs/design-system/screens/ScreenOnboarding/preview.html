<!-- @dsCard group="Screens · Start" height=800 width=400 page="true" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Onboarding</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
/* Drag glyph (four-way move arrows) on the 20px grid, round caps: the hint is about moving the orb. */
function MoveGlyph() {
  return h('svg', { width: 16, height: 16, viewBox: '0 0 20 20', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': 'true', focusable: 'false' },
    h('path', { d: 'M10 3.4v13.2M3.4 10h13.2M8 5.4l2-2 2 2M8 14.6l2 2 2-2M5.4 8l-2 2 2 2M14.6 8l2 2-2 2' }));
}
function Onboarding() {
  var c = React.useState(['Class 5', 'Class 7']), classes = c[0], setClasses = c[1];
  function toggle(k) { setClasses(classes.indexOf(k) > -1 ? classes.filter(function (x) { return x !== k; }) : classes.concat([k])); }
  /* v3 pads onboarding 16px 22px 24px (other screens 4px 20px 96px), so the content sits in a 12px 2px inset. */
  return h(S.PhoneScreen, { padBottom: 24, gap: 0 },
    h('div', { style: { flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', gap: 16, padding: '12px 2px 0' } },
      h(S.Orb, { size: 60, decorative: true }),
      h('div', null,
        h('h1', { style: { margin: 0, font: '700 28px/1.14 var(--font-display)', letterSpacing: '-.012em' } }, h('span', { lang: 'hi' }, 'नमस्ते'), ', I’m VIDYA'),
        h('p', { style: { margin: '8px 0 0', font: '400 14px/1.55 var(--font-ui)', color: 'var(--text-body)' } }, 'Tell me what you teach. I’ll stay a tap away on every screen after this.')),
      h(S.LanguagePicker, { defaultValue: 'hi' }),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 9 } },
        h(S.Eyebrow, { id: 'ob-classes' }, 'Classes you teach'),
        h('div', { role: 'group', 'aria-labelledby': 'ob-classes', style: { display: 'flex', gap: 7, flexWrap: 'wrap' } }, ['Class 5', 'Class 7', 'Class 8'].map(function (k) {
          return h(S.Chip, { key: k, tone: 'leaf', selected: classes.indexOf(k) > -1, emphasis: 'quiet', onClick: function () { toggle(k); } }, k);
        }))),
      h(S.BoardSwitch, { defaultValue: 'CBSE' }),
      h(S.GlassCard, { radius: 'card', padding: '14px 15px', style: { flexDirection: 'row', alignItems: 'center', gap: 12, background: 'rgba(255,255,255,.76)' } },
        h('span', { 'aria-hidden': 'true', style: { width: 34, height: 34, borderRadius: 'var(--radius-pill)', background: 'var(--accent-wash)', color: 'var(--saffron-600)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' } }, h(MoveGlyph)),
        h('div', { style: { font: '400 12px/1.5 var(--font-ui)', color: 'var(--text-body)' } }, 'Drag me anywhere you like, left hand or right. I’ll remember.')),
      h('div', { style: { flex: 1 } }),
      h(S.Button, { block: true }, 'Start teaching')));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(Onboarding)));
</script>
</body></html>
