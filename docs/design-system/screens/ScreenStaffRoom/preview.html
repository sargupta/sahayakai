<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Staff room</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
var GROUPS = [
  { name: 'Science · 7', meta: '1,204 members', tone: 'saffron' },
  { name: 'Maharashtra', meta: '3,880 members', tone: 'leaf' },
  { name: 'Multigrade teaching', meta: '610 members', tone: 'indigo' },
  { name: '9 Maths · ICSE', meta: '412 members', tone: 'saffron' },
  { name: 'KSEEB · 8', meta: '286 members', tone: 'leaf' }
];
function StaffRoom() {
  var l = React.useState({ n: 38, on: false }), like = l[0], setLike = l[1];
  var t = React.useState(false), translated = t[0], setTranslated = t[1];
  var s = React.useState(false), saved = s[0], setSaved = s[1];
  var m = React.useState(false), listening = m[0], setListening = m[1];
  function go() {}
  var find = h('button', { type: 'button', onClick: go, className: 'sk-hit',
    style: { flex: 'none', margin: 0, padding: '8px 13px', border: '1px solid var(--border-glass)', borderRadius: 'var(--radius-pill)', background: 'rgba(255,255,255,.75)', cursor: 'pointer', font: '600 12px var(--font-ui)', color: 'var(--saffron-600)', '--sk-hit-inset': '-6px -2px' } }, 'Find teachers');
  return h(S.PhoneScreen, {
    gap: 12,
    overlay: [
      h('div', { key: 'o', className: 'sk-orb-park' }, h(S.Orb, { onClick: go })),
      h('div', { key: 't', className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'community' }))
    ]
  },
    h(S.ScreenHeader, { level: 'screen', title: 'Staff room', subtitle: '42 teachers here now', trailing: find, align: 'end' }),
    h(S.SearchField, { surface: 'glass', glyph: false, label: 'Ask the staff room', placeholder: 'Ask something, or share what worked', micState: listening ? 'listening' : 'idle', onMic: function () { setListening(!listening); } }),
    h('ul', { className: 'sk-grouptile-row', 'aria-label': 'Groups' },
      GROUPS.map(function (g) { return h('li', { key: g.name }, h(S.GroupTile, Object.assign({ onClick: go }, g))); })),
    h('div', { style: { flex: 1, minHeight: 0, overflow: 'hidden', display: 'flex', flexDirection: 'column', gap: 10 } },
      h(S.PostCard, { size: 'room', author: 'Ravi Kumar', meta: 'Science · Class 7 · 2h ago', type: 'tried', avatarTone: 'saffron',
        body: translated ? 'मैंने रोटी काटकर भिन्न पढ़ाए। बच्चे आखिरकार आधा और चौथाई समझ गए।' : 'Taught fractions by cutting chapatis. The kids finally understood halves and quarters.',
        likes: like.n, liked: like.on, onLike: function () { setLike({ n: like.n + (like.on ? -1 : 1), on: !like.on }); },
        comments: 12, commentsLabel: '12 replies', translated: translated, onTranslate: function () { setTranslated(!translated); } }),
      h(S.PostCard, { size: 'room', author: 'Aisha Khan', meta: 'Shared a worksheet · 5h ago', avatarTone: 'indigo',
        attachment: { title: 'Photosynthesis · Class 7', meta: 'Hindi · 214 downloads', saved: saved, onSave: function () { setSaved(!saved); } } })));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(StaffRoom)));
</script>
</body></html>
