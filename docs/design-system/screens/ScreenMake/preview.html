<!-- @dsCard group="Screens · Make" height=800 width=400 page="true" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Make</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Stage(screen) { return h('div', { className: 'sk-stage sk-stage--canvas', style: { alignItems: 'center', borderRadius: 0, padding: 20 } }, screen); }
function grid(kids) { return h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 9 } }, kids); }
function Make() {
  var s = React.useState('idle'), speak = s[0], setSpeak = s[1];
  function go() {}
  return h(S.PhoneScreen, {
    gap: 12,
    overlay: [
      h('div', { key: 'o', className: 'sk-orb-park' }, h(S.Orb, { onClick: go })),
      h('div', { key: 't', className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'library' }))
    ]
  },
    h(S.ScreenHeader, { level: 'screen', title: 'What are we making?' }),
    h(S.SpeakCard, {
      state: speak, example: 'Class 5 fractions revision sheet', language: 'English', level: .4,
      transcript: 'A revision sheet on fractions for Class 5',
      onSpeak: function () { setSpeak(speak === 'idle' ? 'listening' : 'idle'); }, onType: go,
    }),
    h(S.Eyebrow, { id: 'mk-prepare' }, 'Prepare'),
    h('div', { role: 'group', 'aria-labelledby': 'mk-prepare' }, grid([
      h(S.Tile, { key: 1, title: 'Lesson plan', subtitle: 'Timed 40 minutes', onClick: go }),
      h(S.Tile, { key: 2, title: 'Worksheet', subtitle: 'Printable practice', onClick: go }),
    ])),
    h(S.Eyebrow, { id: 'mk-assess' }, 'Assess'),
    h('div', { role: 'group', 'aria-labelledby': 'mk-assess' }, grid([
      h(S.Tile, { key: 1, title: 'Quiz', subtitle: 'Up to 20 questions', onClick: go }),
      h(S.Tile, { key: 2, title: 'Exam paper', subtitle: 'Board blueprint', onClick: go }),
      h(S.Tile, { key: 3, title: 'Rubric', subtitle: 'Criteria × levels', onClick: go }),
      h(S.Tile, { key: 4, title: 'Attendance', subtitle: 'Voice roll call', onClick: go }),
      h(S.Tile, { key: 5, title: 'Assess work', subtitle: 'Grade a photo of written work', onClick: go }),
      h(S.Tile, { key: 6, title: 'Scanner', subtitle: 'Read a stack of sheets', onClick: go }),
    ])),
    h(S.DisclosureRow, { title: 'Explore · 8 more tools', subtitle: 'Field trips, visual aids, training and more', onClick: go }));
}
ReactDOM.createRoot(document.getElementById('root')).render(Stage(h(Make)));
</script>
</body></html>
