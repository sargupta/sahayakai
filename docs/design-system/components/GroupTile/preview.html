<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GroupTile</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
var ROOM = [
  { name: 'Science · 7', meta: '1,204 members', tone: 'saffron' },
  { name: 'Maharashtra', meta: '3,880 members', tone: 'leaf' },
  { name: '8 Science · KSEEB', meta: '610 members', tone: 'indigo' },
  { name: '9 Maths · ICSE', meta: '412 members', tone: 'saffron' },
  { name: 'Karnataka', meta: '3,880 members', tone: 'leaf' }
];
function Demo() {
  var o = React.useState(null), opened = o[0], setOpened = o[1];
  return h('div', { className: 'sk-slices' },
    h('div', { className: 'sk-slice' },
      h('div', { className: 'sk-slice__label' }, 'Staff room row · scrolls and snaps'),
      h('ul', { className: 'sk-grouptile-row', 'aria-label': 'Your groups' },
        ROOM.map(function (g) { return h('li', { key: g.name }, h(S.GroupTile, Object.assign({ onClick: function () { setOpened(g.name); } }, g))); })),
      h('div', { className: 'sk-slice__label', 'aria-live': 'polite' }, opened ? 'Opened ' + opened : 'Swipe sideways · tap to open')),
    h('div', { className: 'sk-slice' },
      h('div', { className: 'sk-slice__label' }, 'Tones · in Hindi'),
      h('div', { style: { display: 'flex', gap: 9 } },
        h(S.GroupTile, { name: 'Science · 7', meta: '1,204 members', tone: 'saffron', onClick: function () {} }),
        h(S.GroupTile, { name: 'Maharashtra', meta: '3,880 members', tone: 'leaf', onClick: function () {} })),
      h('div', { style: { display: 'flex', gap: 9 } },
        h(S.GroupTile, { name: '9 Maths · CBSE', meta: '412 members', tone: 'indigo', onClick: function () {} }),
        h(S.GroupTile, { lang: 'hi', name: 'हिन्दी · 6', meta: '980 सदस्य', tone: 'saffron', onClick: function () {} }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
