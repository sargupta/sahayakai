<!-- @dsCard group="Library and offline" height=350 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ConversationRow</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function list(name, kids) { return h('ul', { 'aria-label': name, style: { display: 'flex', flexDirection: 'column', gap: 9, margin: 0, padding: 0, listStyle: 'none' } }, kids); }
function Demo() {
  var k = React.useState({ 3: true }), kept = k[0], setKept = k[1];
  var o = React.useState(''), opened = o[0], setOpened = o[1];
  function keep(n) { return function (v) { var m = Object.assign({}, kept); m[n] = v; setKept(m); }; }
  function open(what) { return function () { setOpened(what); }; }
  return h('div', { className: 'sk-slices' },
    h('div', { className: 'sk-slice' },
      h('div', { className: 'sk-slice__label' }, 'Every chat lands here · keep one'),
      list('Conversations', [
        h(S.ConversationRow, { key: 1, as: 'li', ask: 'Why does a cold glass of water get wet on the outside?', messages: 6, mode: 'typed', when: 'today', kept: !!kept[1], onKeep: keep(1), onClick: open('cold glass') }),
        h(S.ConversationRow, { key: 2, as: 'li', lang: 'hi', ask: 'कक्षा छह के लिए जल चक्र की पाठ योजना बनाओ', messages: 12, mode: 'live', when: 'yesterday', kept: !!kept[2], onKeep: keep(2), onClick: open('जल चक्र') }),
        h(S.ConversationRow, { key: 3, as: 'li', ask: 'How do I show condensation with a steel tumbler?', messages: 8, mode: 'voice', when: '16 Sept', kept: !!kept[3], onKeep: keep(3), onClick: open('condensation') })
      ]),
      h('div', { 'aria-live': 'polite', style: { font: '400 12px var(--font-ui)', color: 'var(--text-body)', minHeight: 14 } }, opened ? 'Opened: ' + opened : '')),
    h('div', { className: 'sk-slice' },
      h('div', { className: 'sk-slice__label' }, 'In हिन्दी · without the keep toggle'),
      list('बातचीत', [
        h(S.ConversationRow, { key: 1, as: 'li', lang: 'hi', ask: 'भाप बनने को रसोई के उदाहरण से कैसे समझाऊँ?', meta: '9 संदेश · लाइव आवाज़ · कल', onClick: open('भाप') }),
        h(S.ConversationRow, { key: 2, as: 'li', ask: 'Ideas for a group activity on evaporation', messages: 4, mode: 'typed', when: '15 Sept', kept: true, onClick: open('evaporation') })
      ])));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
