<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
/* Phone slices: 360px, the phone's true width. The corner glow is clipped inside the slice, so nothing pokes out of it. */
function Glow() { return h('div', { 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, overflow: 'hidden', borderRadius: 'inherit', pointerEvents: 'none' } }, h('div', { style: { position: 'absolute', top: -70, right: -60, width: 220, height: 220, borderRadius: 9999, background: 'var(--glow-saffron)' } })); }
function isHi(t) { return typeof t === 'string' && /[ऀ-ൿ]/.test(t); }
function Slice(p) {
  var vs = (p.v || '').split(' ').filter(Boolean);
  var cls = 'sk-slice' + vs.filter(function (x) { return x !== 'glow'; }).map(function (x) { return ' sk-slice--' + x; }).join('');
  return h('div', { className: cls, style: p.style }, vs.indexOf('glow') !== -1 ? h(Glow) : null, p.label ? h('div', { className: 'sk-slice__label' + (isHi(p.label) ? ' sk-indic' : '') }, p.label) : null, p.children);
}
function Row(p) { return h('div', { className: 'sk-slices', style: Object.assign({ alignItems: 'stretch' }, p.style) }, p.children); }
function Note(t) { return h('div', { className: 'sk-slice__label' + (isHi(t) ? ' sk-indic' : ''), style: { marginTop: 4 } }, t); }
function Pair(a, b) { return h('div', { style: { display: 'flex', gap: 9 } }, a, b); }
function Body(t) { return h('div', { style: { font: '400 12px/1.6 var(--font-ui)', color: 'var(--text-body)' } }, t); }
function Demo() {
  var d = React.useState(false), done = d[0], setDone = d[1];
  return h('div', null,
    h(Row, null,
      h(Slice, { v: 'glow', label: 'Make a lesson · the foot of the screen', style: { paddingBottom: 96 } },
        h(S.NoticeCard, { mark: 'C' }, 'Aligned to CBSE · NCERT Ganita Prakash 7, Chapter 8 before anything is written'),
        h(S.GlassCard, { tone: 'soft', padding: '13px 14px', gap: 5, style: { flex: 1 } },
          h('div', { style: { font: '600 12px/1.3 var(--font-ui)' } }, 'Recent'),
          h('div', { style: { font: '400 12px/1.7 var(--font-ui)', color: 'var(--text-body)' } }, 'Water cycle · Class 6', h('br'), 'Photosynthesis · Class 7', h('br'), 'Place value · Class 5')),
        h(S.Button, { block: true }, 'Generate lesson'),
        h('div', { className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'library' }))),
      h(Slice, { label: 'Paired · 50px · colour is meaning' },
        h(S.GlassCard, { tone: 'strong', radius: 'tile', gap: 5 },
          h('div', { style: { font: '600 12px/1.4 var(--font-ui)' } }, 'Board work · 12 min'),
          Body('Write 1/2 = 2/4 = 4/8 and ask the class to find two more equal names for each.')),
        Pair(h(S.Button, { size: 'md', style: { flex: 1 } }, 'Deliver'), h(S.Button, { size: 'md', variant: 'secondary' }, 'Edit')),
        Note('Roll call · leaf completes the register'),
        h(S.Button, { block: true, variant: 'success', onClick: function () { setDone(!done); } }, done ? 'Attendance saved' : 'Submit attendance'),
        Note('On a call · red only ends something live'),
        Pair(h(S.Button, { size: 'md', variant: 'danger', style: { flex: 1 } }, 'End call'), h(S.Button, { size: 'md', variant: 'secondary' }, 'Mute')))),
    h(Row, { style: { paddingTop: 4 } },
      h(Slice, { v: 'card', label: 'Inside a sheet · 46px' },
        Pair(h(S.Button, { size: 'sm', variant: 'outline', style: { flex: 1 } }, 'Minimise to orb'), h(S.Button, { size: 'sm', variant: 'quiet', style: { flex: 1 } }, 'Stop')),
        Note('Deliver tray · one send'),
        h(S.Button, { size: 'md', block: true, style: { boxShadow: 'var(--shadow-cta-tray)' } }, 'Send to parent group'),
        Note('VIDYA’s offer · compact'),
        h('div', { style: { display: 'flex', gap: 7 } }, h(S.Button, { size: 'xs', style: { minWidth: 112 } }, 'Build it'), h(S.Button, { size: 'xs', variant: 'accent-outline', style: { minWidth: 112 } }, 'Message parents'))),
      h(Slice, { v: 'glow', label: 'States · Indic labels wrap, never truncate' },
        h(S.Button, { block: true, disabled: true }, 'Generate lesson'),
        h('div', { style: { font: '400 12px/1.45 var(--font-ui)', color: 'var(--text-body)', marginTop: -4 } }, 'Disabled until there is a topic.'),
        h(S.Button, { block: true, lang: 'hi' }, 'पाठ बनाइए'),
        Pair(h(S.Button, { size: 'md', lang: 'ta', style: { flex: 1 } }, 'பெற்றோர் குழுவுக்கு அனுப்பு'), h(S.Button, { size: 'md', variant: 'secondary', lang: 'ta' }, 'திருத்து')),
        Pair(h(S.Button, { size: 'sm', variant: 'outline', lang: 'ml', style: { flex: 1 } }, 'ഓർബിലേക്ക് ചെറുതാക്കുക'), h(S.Button, { size: 'sm', variant: 'quiet', lang: 'ml', style: { flex: 1 } }, 'നിർത്തുക')))),
    h('div', { className: 'sk-webstage', style: { margin: '4px 12px 12px', borderRadius: 18, padding: '16px 20px' } },
      h('div', { className: 'sk-webstage__label' }, 'Website · 44px, at desktop width'),
      h('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap' } },
        h(S.Button, { size: 'web' }, 'Watch it work'), h(S.Button, { size: 'web', variant: 'outline' }, 'How it works'), h(S.Button, { size: 'web', variant: 'dark' }, 'Book a school pilot'), h(S.Button, { size: 'web', disabled: true }, 'Disabled'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
