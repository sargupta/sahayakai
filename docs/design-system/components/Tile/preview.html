<!-- @dsCard group="Surfaces" height=404 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tile</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
/* Phone slices: 360px, the phone's true width. The corner glow is clipped inside the slice, so nothing pokes out of it. */
function Glow() { return h('div', { 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, overflow: 'hidden', borderRadius: 'inherit', pointerEvents: 'none' } }, h('div', { style: { position: 'absolute', top: -70, right: -60, width: 220, height: 220, borderRadius: 9999, background: 'var(--glow-saffron)' } })); }
function isHi(t) { return typeof t === 'string' && /[ऀ-ൿ]/.test(t); }
function Slice(p) {
  var vs = (p.v || '').split(' ').filter(Boolean);
  var cls = 'sk-slice' + vs.filter(function (x) { return x !== 'glow'; }).map(function (x) { return ' sk-slice--' + x; }).join('');
  return h('div', { className: cls, style: p.style }, vs.indexOf('glow') !== -1 ? h(Glow) : null, p.label ? h('div', { className: 'sk-slice__label' + (isHi(p.label) ? ' sk-indic' : '') }, p.label) : null, p.children);
}
function Row(p) { return h('div', { className: 'sk-slices', style: Object.assign({ alignItems: 'stretch' }, p.style) }, p.children); }
function Note(t) { return h('div', { className: 'sk-slice__label' + (isHi(t) ? ' sk-indic' : ''), style: { marginTop: 4 } }, t); }
function grid(kids) { return h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 9 } }, kids); }
function Demo() {
  var s = React.useState('worksheet'), pick = s[0], setPick = s[1];
  var n = React.useState(''), opened = n[0], setOpened = n[1];
  function open(t) { return function () { setOpened(t); }; }
  return h(Row, null,
    h(Slice, { v: 'glow', label: 'Home · quick actions, two across', style: { paddingBottom: 96 } },
      h(S.GlassCard, { radius: 'panel', raised: true, gap: 10 },
        h(S.Eyebrow, null, 'Waiting for you'),
        h(S.TaskRow, { dot: 'leaf', label: 'Fractions lesson ready', statusLabel: 'ready', action: 'Open', onAction: function () {} })),
      grid([
        h(S.Tile, { key: 1, title: 'Roll call', subtitle: 'Speak the names', onClick: open('Roll call') }),
        h(S.Tile, { key: 2, title: 'Make a lesson', subtitle: 'Any topic, any class', onClick: open('Make a lesson') }),
        h(S.Tile, { key: 3, title: 'Scan a test', subtitle: 'Camera grading', onClick: open('Scan a test') }),
        h(S.Tile, { key: 4, title: 'Call parents', subtitle: 'Script in हिन्दी', onClick: open('Call parents') }),
      ]),
      h('div', { 'aria-live': 'polite', style: { font: '400 12px/1.45 var(--font-ui)', color: 'var(--text-body)', minHeight: 16 } }, opened ? 'Opening ' + opened : ''),
      h('div', { className: 'sk-tabbar-dock' }, h(S.TabBar, { active: 'home' }))),
    h(Slice, { label: 'Toggle pair · Hindi · disabled' },
      grid([
        h(S.Tile, { key: 1, title: 'Worksheet', subtitle: '10 questions', selected: pick === 'worksheet', onClick: function () { setPick('worksheet'); } }),
        h(S.Tile, { key: 2, title: 'Quiz', subtitle: '5 questions · MCQ', selected: pick === 'quiz', onClick: function () { setPick('quiz'); } }),
      ]),
      Note('In Hindi · subtitles wrap'),
      grid([
        h(S.Tile, { key: 1, lang: 'hi', title: 'हाज़िरी', subtitle: 'नाम बोलिए', onClick: function () {} }),
        h(S.Tile, { key: 2, lang: 'hi', title: 'पाठ बनाइए', subtitle: 'कोई भी विषय, कोई भी कक्षा', onClick: function () {} }),
      ]),
      Note('Disabled · needs signal'),
      grid([
        h(S.Tile, { key: 1, title: 'Call parents', subtitle: 'Needs signal', disabled: true, onClick: function () {} }),
        h(S.Tile, { key: 2, title: 'Roll call', subtitle: 'Works offline', onClick: function () {} }),
      ])));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
