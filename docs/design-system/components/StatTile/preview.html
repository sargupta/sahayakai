<!-- @dsCard group="Console" height=505 width=1100 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StatTile</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function row3(kids) { return h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 7 } }, kids); }
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { background: 'var(--surface-web)' } },
    h('div', { className: 'sk-slices' },
      h('div', { className: 'sk-slice sk-slice--glow' },
        h('div', { className: 'sk-slice__label' }, 'Phone · scan results · sm'),
        row3([
          h(S.StatTile, { key: 1, value: '68%', label: 'Class average' }),
          h(S.StatTile, { key: 2, value: '4', label: 'Weak concepts', tone: 'red' }),
          h(S.StatTile, { key: 3, value: '11', label: 'Need help' }),
        ])),
      h('div', { className: 'sk-slice' },
        h('div', { className: 'sk-slice__label sk-indic' }, 'In हिन्दी'),
        h('div', { lang: 'hi' }, row3([
          h(S.StatTile, { key: 1, value: '68%', label: 'कक्षा का औसत' }),
          h(S.StatTile, { key: 2, value: '4', label: 'कमज़ोर अवधारणाएँ', tone: 'red' }),
          h(S.StatTile, { key: 3, value: '11', label: 'मदद चाहिए' }),
        ])))),
    h('div', { className: 'sk-webstage' },
      h('div', { className: 'sk-webstage__label' }, 'School console · KPI row · lg, four across'),
      h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0, 1fr))', gap: 14 } },
        h(S.StatTile, { size: 'lg', value: '38', label: 'Calls to families · today', delta: '212 in the last 7 days', series: [24, 31, 28, 35, 30, 26, 38] }),
        h(S.StatTile, { size: 'lg', value: '31', label: 'Heard the key fact · today', delta: '4 more than yesterday', deltaTone: 'good', series: [19, 22, 24, 21, 25, 27, 31] }),
        h(S.StatTile, { size: 'lg', value: '17', label: 'Confirmed, pressed 1 · today', delta: '3 more than yesterday', deltaTone: 'good', series: [9, 12, 10, 14, 13, 14, 17] }),
        h(S.StatTile, { size: 'lg', value: '1', label: 'Asked to stop calls · today', delta: '4 families in all', series: [0, 1, 0, 0, 2, 0, 1] })),
      h('div', { className: 'sk-webstage__label' }, 'Teacher web app · three across'),
      h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 14 } },
        h(S.StatTile, { size: 'lg', value: '91%', label: 'Attendance · today, all classes', delta: '3 points lower than Monday', deltaTone: 'bad', series: [95, 94, 96, 94, 95, 93, 91] }),
        h(S.StatTile, { size: 'lg', value: '12', label: 'Lessons made · last 7 days', delta: 'Same as last week', series: [1, 2, 3, 1, 2, 2, 1] }),
        h(S.StatTile, { size: 'lg', value: '6', label: 'Parent calls · this week', delta: '2 more than last week', deltaTone: 'good', series: [1, 0, 2, 1, 0, 1, 1] })))
  )
);
</script>
</body></html>
