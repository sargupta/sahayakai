<!-- @dsCard group="Surfaces" height=702 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GlassCard</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
/* Phone slices: 360px, the phone's true width. The corner glow is clipped inside the slice, so nothing pokes out of it. */
function Glow() { return h('div', { 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, overflow: 'hidden', borderRadius: 'inherit', pointerEvents: 'none' } }, h('div', { style: { position: 'absolute', top: -70, right: -60, width: 220, height: 220, borderRadius: 9999, background: 'var(--glow-saffron)' } })); }
function isHi(t) { return typeof t === 'string' && /[ऀ-ൿ]/.test(t); }
function Slice(p) {
  var vs = (p.v || '').split(' ').filter(Boolean);
  var cls = 'sk-slice' + vs.filter(function (x) { return x !== 'glow'; }).map(function (x) { return ' sk-slice--' + x; }).join('');
  return h('div', { className: cls, style: p.style }, vs.indexOf('glow') !== -1 ? h(Glow) : null, p.label ? h('div', { className: 'sk-slice__label' + (isHi(p.label) ? ' sk-indic' : '') }, p.label) : null, p.children);
}
function Row(p) { return h('div', { className: 'sk-slices', style: Object.assign({ alignItems: 'stretch' }, p.style) }, p.children); }
function Note(t) { return h('div', { className: 'sk-slice__label' + (isHi(t) ? ' sk-indic' : ''), style: { marginTop: 4 } }, t); }
function noop() {}
function line(t, f, lang) { return h('div', { lang: lang, className: lang ? 'sk-indic' : null, style: { font: f || '400 12px/1.6 var(--font-ui)', color: 'var(--text-body)' } }, t); }
function title(t, lang) { return h('div', { lang: lang, className: lang ? 'sk-indic' : null, style: { font: '600 12px/1.4 var(--font-ui)', color: 'var(--text-strong)' } }, t); }
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    h(Row, null,
      h(Slice, { v: 'glow', label: 'Home · one raised panel, soft tiles' },
        h(S.GlassCard, { radius: 'panel', raised: true, gap: 10 },
          h(S.Eyebrow, null, 'Waiting for you'),
          h(S.TaskRow, { dot: 'red', label: '4 absentees to call', statusLabel: 'urgent', action: 'Open', onAction: noop }),
          h(S.TaskRow, { dot: 'amber', label: '34 test sheets to scan', statusLabel: 'waiting', action: 'Open', onAction: noop }),
          h(S.TaskRow, { dot: 'leaf', label: 'Fractions lesson ready', statusLabel: 'ready', action: 'Open', onAction: noop })),
        h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 9 } },
          h(S.GlassCard, { tone: 'soft', padding: 13, gap: 2 }, h('div', { style: { font: '600 13px var(--font-display)' } }, 'Roll call'), line('Speak the names', '400 12px var(--font-ui)')),
          h(S.GlassCard, { tone: 'soft', padding: 13, gap: 2 }, h('div', { style: { font: '600 13px var(--font-display)' } }, 'Make a lesson'), line('Any topic, any class', '400 12px var(--font-ui)')))),
      h(Slice, { v: 'glow', label: 'Lesson output · strong, for reading' },
        h(S.GlassCard, { radius: 'tile', tone: 'strong', gap: 5 }, title('Hook · 5 min'), line('Hold up one chapati. Ask: if four of you share this, how much does each get?')),
        h(S.GlassCard, { radius: 'tile', tone: 'strong', gap: 5 }, title('Activity · 15 min'), line('Groups of four cut paper circles into halves, quarters and eighths, and trade pieces.')),
        h(S.GlassCard, { radius: 'tile', tone: 'strong', gap: 5 }, title('बोर्ड का काम · 12 मिनट', 'hi'), line('लिखिए 1/2 = 2/4 = 4/8, फिर कक्षा से हर एक के दो और बराबर नाम निकलवाइए।', '400 12px/1.7 var(--font-ui)', 'hi')))),
    h(Row, { style: { paddingTop: 4 } },
      h(Slice, { v: 'card', label: 'Inside a sheet · inset context' },
        h(S.GlassCard, { radius: 'field', tone: 'inset', gap: 5 },
          h(S.Eyebrow, { size: 'tight' }, 'This page'),
          line('Fractions · Class 7 · lesson plan', '500 12px/1.25 var(--font-ui)')),
        h(S.GlassCard, { radius: 'field', tone: 'inset', gap: 7 },
          h(S.Eyebrow, { size: 'tight' }, 'Draft so far'),
          line('शुरुआत: रोटी को चार बराबर हिस्सों में बाँटिए…', '400 12px/1.7 var(--font-ui)', 'hi')),
        Note('Solid · on a milk ground'),
        h(S.GlassCard, { radius: 'tile', tone: 'solid', gap: 5 }, title('Students needing help'), line('Aarav · Kavya · Imran · Divya · Rohit · and 6 more', '400 12px/1.6 var(--font-ui)'))),
      h(Slice, { v: 'glow', label: 'Community · accent edge, VIDYA’s post' },
        h(S.GlassCard, { radius: 'tile', tone: 'accent', raised: true, gap: 10 },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
            h(S.Avatar, { name: 'Daily Briefing', shape: 'square', tone: 'saffron', initials: 'स', lang: 'hi' }),
            h('div', { style: { flex: 1, minWidth: 0 } }, title('Daily Briefing'), line('Thu, 18 Sept · automated', '400 12px/1.4 var(--font-ui)')),
            h(S.Pill, { tone: 'saffron' }, 'Resource')),
          line('CBSE circular: capacity-building programme for skill subjects, registration open till 30 Sept.', '400 12px/1.6 var(--font-ui)')),
        h(S.GlassCard, { radius: 'tile', tone: 'strong', raised: true, gap: 10 },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
            h(S.Avatar, { name: 'Suresh Reddy', size: 'sm', tone: 'amber' }),
            h('div', null, title('Suresh Reddy'), line('Maths · Class 7 · 11 hours ago', '400 12px/1.4 var(--font-ui)'))),
          line('Taught fractions by cutting chapatis. The class finally understood halves and quarters.', '400 12px/1.6 var(--font-ui)')))))
);
</script>
</body></html>
