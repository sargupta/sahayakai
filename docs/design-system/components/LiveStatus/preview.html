<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LiveStatus</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function col(kids) { return h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 10 } }, kids); }
function Demo() {
  return h('div', { className: 'sk-slices' },
    h('div', { className: 'sk-slice' },
      h('div', { className: 'sk-slice__label' }, 'Every state'),
      col([
        h(S.LiveStatus, { key: 1, state: 'resting' }),
        h(S.LiveStatus, { key: 2, state: 'connecting' }),
        h(S.LiveStatus, { key: 3, state: 'listening', language: 'हिन्दी', languageLang: 'hi' }),
        h(S.LiveStatus, { key: 4, state: 'working', label: 'Checking CBSE source' }),
        h(S.LiveStatus, { key: 5, state: 'speaking', language: 'हिन्दी', languageLang: 'hi' }),
        h(S.LiveStatus, { key: 6, state: 'paused' }),
        h(S.LiveStatus, { key: 7, state: 'failed' }),
        h(S.LiveStatus, { key: 8, state: 'offline' })])),
    h('div', { className: 'sk-slice' },
      h('div', { className: 'sk-slice__label' }, 'In the teacher’s language'),
      col([
        h(S.LiveStatus, { key: 1, state: 'listening', label: 'सुन रही हूँ', lang: 'hi' }),
        h(S.LiveStatus, { key: 2, state: 'speaking', label: 'বলছি', lang: 'bn', language: 'বাংলা', languageLang: 'bn' }),
        h(S.LiveStatus, { key: 3, state: 'working', label: 'Checking KSEEB source' })]),
      h('div', { className: 'sk-slice__label', style: { marginTop: 8 } }, 'Web app size'),
      col([
        h(S.LiveStatus, { key: 1, state: 'resting', size: 'web', label: 'Meet VIDYA, tap and talk' }),
        h(S.LiveStatus, { key: 2, state: 'listening', size: 'web', language: 'हिन्दी', languageLang: 'hi' }),
        h(S.LiveStatus, { key: 3, state: 'working', size: 'web', label: 'Thinking' })])));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
