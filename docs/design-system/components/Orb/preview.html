<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Orb</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;

function Glow() { return h('div', { 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, overflow: 'hidden', borderRadius: 'inherit', pointerEvents: 'none' } }, h('div', { style: { position: 'absolute', top: -70, right: -60, width: 220, height: 220, borderRadius: 9999, background: 'var(--glow-saffron)' } })); }
function isHi(t) { return typeof t === 'string' && /[ऀ-ൿ]/.test(t); }

  var vs = (p.v || '').split(' ').filter(Boolean);
  var cls = 'sk-slice' + vs.filter(function (x) { return x !== 'glow'; }).map(function (x) { return ' sk-slice--' + x; }).join('');
  return h('div', { className: cls, style: p.style }, vs.indexOf('glow') !== -1 ? h(Glow) : null, p.label ? h('div', { className: 'sk-slice__label' + (isHi(p.label) ? ' sk-indic' : '') }, p.label) : null, p.children);
}

  ['offline', 'Offline', 'Voice paused, typing still works']

        line(h(S.Orb, { size: 42, state: 'working', decorative: true, style: { boxShadow: 'var(--shadow-orb-working-sm)' } }), 'Working sheet · 42px', 'Writing in the background'),
        line(h(S.Orb, { size: 36, state: 'ready', decorative: true, style: { boxShadow: 'var(--shadow-orb-ready-sm)' } }), 'Deliver tray · 36px', 'Heads the tray when work is ready'))),
    h(Row, { style: { paddingTop: 4 } },
      h(Slice, { v: 'glow', label: 'Output · ready, parked above the actions', style: { height: 236 } },
        h(S.GlassCard, { tone: 'strong', radius: 'tile', gap: 5, style: { height: 92 } },

          h('div', { style: { font: '400 12px/1.6 var(--font-ui)', color: 'var(--text-body)' } }, 'Write 1/2 of 1/4 = 1/8 and ask for a quarter of a half.')),

        h('div', { style: { position: 'absolute', right: 16, bottom: 74 } }, h(S.Orb, { state: 'ready', badge: 1, onClick: function () {} }))),

        h('div', { style: { position: 'absolute', right: 16, bottom: 24 } }, h(S.Orb, { tone: 'camera', onClick: function () {} })))))
);
</script>
</body></html>
