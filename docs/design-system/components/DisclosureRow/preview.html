<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Demo() {
  var e = React.useState(false), more = e[0], setMore = e[1];
  var a = React.useState(false), adv = a[0], setAdv = a[1];
  return h('div', { className: 'sk-slices' },
    h('div', { className: 'sk-slice' },
      h('div', { className: 'sk-slice__label' }, 'Card · expands in place'),
      h(S.DisclosureRow, { title: 'Explore · 8 more tools', subtitle: 'Field trips, visual aids, training and more', expanded: more, controls: 'more-tools', onClick: function () { setMore(!more); } }),
      more ? h('div', { id: 'more-tools', style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 9 } },

      h('div', { className: 'sk-slice__label' }, 'Card · leads to a screen'),

    h('div', { className: 'sk-slice' },

      adv ? h('div', { id: 'adv' }, h(S.Field, { label: 'Difficulty', size: 'md', as: 'select', value: 'Mixed' })) : h('div', { id: 'adv', hidden: true }),
      h('div', { className: 'sk-slice__label' }, 'In हिन्दी'),

      h(S.DisclosureRow, { lang: 'hi', variant: 'toggle', title: 'और विकल्प दिखाएँ', expanded: false, onClick: function () {} })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
