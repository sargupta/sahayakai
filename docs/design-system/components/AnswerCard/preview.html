<!-- @dsCard group="Conversation" height=449 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AnswerCard</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Slice(label, kids) { return h('div', { className: 'sk-slice' }, h('div', { className: 'sk-slice__label' }, label), kids); }
function Demo() {
  var r = React.useState(false), reading = r[0], setReading = r[1];
  var n = function () {};
  return h('div', { className: 'sk-slices' },
    Slice('Grounded · tap Read aloud', [
      h(S.AnswerCard, { key: 'a', source: 'CBSE · NCERT Curiosity 6, Ch 8', resultName: 'Water cycle lesson plan, Class 6', onOpen: n, onReadAloud: function () { setReading(!reading); }, reading: reading, onAgain: n },
        'Ready: a 40-minute water cycle plan for Class 6. Warm-up, four stages, group activity, wrap-up.'),
      h('div', { key: 's', 'aria-live': 'polite', style: { font: '400 12px/1.45 var(--font-ui)', color: 'var(--text-body)' } }, reading ? 'Reading it back · Read aloud is pressed' : 'Read aloud is a toggle')
    ]),
    Slice('After a voice turn · Hindi', [
      h(S.AnswerCard, { key: 'b', source: 'Source stated aloud', resultName: 'Fractions worksheet, Class 7', onOpen: n, onReadAloud: n, onAgain: n },
        'Ready: 10 questions on Working with Fractions, medium. I said the chapter aloud before I began.'),
      h(S.AnswerCard, { key: 'c', lang: 'hi', source: 'CBSE · NCERT Curiosity 6, Ch 8', resultName: 'जल चक्र पाठ योजना', openLabel: 'खोलें', readAloudLabel: 'सुनाएँ', againLabel: 'फिर से', onOpen: n, onReadAloud: n, onAgain: n },
        'तैयार है: कक्षा 6 के लिए जल चक्र की 40 मिनट की पाठ योजना।')
    ]));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
