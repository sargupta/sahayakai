<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Composer</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
function Slice(label, kids, cls) { return h('div', { className: 'sk-slice ' + (cls || '') }, h('div', { className: 'sk-slice__label' }, label), kids); }
function Label(t) { return h('div', { key: t, className: 'sk-slice__label', style: { marginTop: 4 } }, t); }
function Demo() {
  var s = React.useState(''), said = s[0], setSaid = s[1];
  var m = React.useState(0), mics = m[0], setMics = m[1];
  return h('div', { className: 'sk-slices' },
    Slice('chat · foot of a conversation', [
      h(S.Composer, { key: 'c', variant: 'chat', onSend: setSaid, onMic: function () { setMics(mics + 1); } }),
      h('div', { key: 'f', 'aria-live': 'polite', style: { font: '400 12px/1.45 var(--font-ui)', color: 'var(--text-body)', minHeight: 16 } },
        said ? 'Sent: ' + said : (mics ? 'Mic tapped · VIDYA would start a voice turn' : 'Type and tap send, or press Enter.')),
      Label('chat · offline, typing still sends'),
      h(S.Composer, { key: 'o', variant: 'chat', state: 'offline', onSend: setSaid })
    ]),
    Slice('sheet · under VIDYA’s suggestions', [
      h(S.Composer, { key: 'd', onSubmit: setSaid, onMic: function () { setMics(mics + 1); } }),
      Label('sheet · typed in Hindi, code-mixed'),
      h(S.Composer, { key: 'h', defaultValue: 'इससे एक worksheet बना दो, दस सवाल', lang: 'hi' }),
      Label('sheet · offline, voice needs signal'),
      h(S.Composer, { key: 'x', state: 'offline' })
    ], 'sk-slice--card'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
