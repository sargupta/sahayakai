<!-- @dsCard group="Inputs" height=810 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Field</title></head>
<body style="margin:0">
<div id="root"></div>
<script>
var S = window.SahayakAI, h = React.createElement;
/* Phone slices: 360px, the phone's true width. The corner glow is clipped inside the slice, so nothing pokes out of it. */
function Glow() { return h('div', { 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, overflow: 'hidden', borderRadius: 'inherit', pointerEvents: 'none' } }, h('div', { style: { position: 'absolute', top: -70, right: -60, width: 220, height: 220, borderRadius: 9999, background: 'var(--glow-saffron)' } })); }
function isHi(t) { return typeof t === 'string' && /[ऀ-ൿ]/.test(t); }
function Slice(p) {
  var vs = (p.v || '').split(' ').filter(Boolean);
  var cls = 'sk-slice' + vs.filter(function (x) { return x !== 'glow'; }).map(function (x) { return ' sk-slice--' + x; }).join('');
  return h('div', { className: cls, style: p.style }, vs.indexOf('glow') !== -1 ? h(Glow) : null, p.label ? h('div', { className: 'sk-slice__label' + (isHi(p.label) ? ' sk-indic' : '') }, p.label) : null, p.children);
}
function Row(p) { return h('div', { className: 'sk-slices', style: Object.assign({ alignItems: 'stretch' }, p.style) }, p.children); }
function Note(t) { return h('div', { className: 'sk-slice__label' + (isHi(t) ? ' sk-indic' : ''), style: { marginTop: 4 } }, t); }
function Demo() {
  var t = React.useState('Fractions in everyday cooking'), topic = t[0], setTopic = t[1];
  var m = React.useState('idle'), mic = m[0], setMic = m[1];
  var n = React.useState('83'), count = n[0], setCount = n[1];
  var bad = Number(count) > 38;
  return h('div', null,
    h(Row, null,
      h(Slice, { v: 'glow', label: 'Make a lesson · cards on the wash' },
        h(S.ScreenHeader, { title: 'Make a lesson', subtitle: 'Spoken or typed, same result' }),
        h(S.Field, { label: 'Topic', value: topic, onChange: function (e) { setTopic(e.target.value); }, mic: mic, onMic: function () { setMic(mic === 'idle' ? 'listening' : 'idle'); } }),
        h('div', { style: { display: 'flex', gap: 9 } },
          h(S.Field, { label: 'Class', size: 'md', as: 'select', value: 'Class 7', onOpen: function () {}, style: { flex: 1 } }),
          h(S.Field, { label: 'Length', size: 'md', as: 'select', value: '40 min', onOpen: function () {}, style: { flex: 1 } })),
        h(S.Field, { label: 'Board', size: 'md', as: 'select', value: 'CBSE', onOpen: function () {}, helper: 'CBSE and ICSE / ISC, plus 27 state and UT boards.' })),
      h(Slice, { label: 'Listening · Hindi · optional · empty select' },
        h(S.Field, { label: 'Topic', defaultValue: 'भिन्न · रसोई में आधा और चौथाई', lang: 'hi', mic: 'listening', onMic: function () {}, micStopLabel: 'Stop listening' }),
        h('div', { 'aria-live': 'polite', style: { font: '400 12px/1.45 var(--font-ui)', color: 'var(--text-body)', marginTop: -4 } }, 'Listening · हिन्दी · tap the mic to stop'),
        h(S.Field, { label: 'विषय', size: 'md', lang: 'hi', defaultValue: 'जल की अवस्थाओं की यात्रा' }),
        h(S.Field, { label: 'Students', size: 'md', placeholder: 'How many in the class?', inputMode: 'numeric', optional: true }),
        h(S.Field, { label: 'Length', size: 'md', as: 'select', placeholder: 'Choose a length', onOpen: function () {} }))),
    h(Row, { style: { paddingTop: 4 } },
      h(Slice, { v: 'card', label: 'Inset · inside a sheet or solid card' },
        h(S.Field, { label: 'Message to parents', surface: 'inset', multiline: true, rows: 3, defaultValue: 'Dhruv missed three days this week. Is everything all right at home?', counter: '68 / 300' }),
        Note('Error · what happened and what to do'),
        h(S.Field, { label: 'Students', size: 'md', surface: 'inset', value: count, onChange: function (e) { setCount(e.target.value); }, inputMode: 'numeric', error: bad ? 'Class 7 has 38 students on the register. Check the number.' : null })),
      h(Slice, { v: 'card', label: 'Disabled · says why' },
        h(S.Field, { label: 'School', size: 'md', surface: 'inset', defaultValue: 'Green Valley Public School, Nashik', disabled: true, helper: 'Your school admin sets this.' }),
        h(S.Field, { label: 'Board', size: 'md', surface: 'inset', as: 'select', value: 'Karnataka State Board (KSEEB)', onOpen: function () {} }),
        h(S.Field, { label: 'शिक्षक का नाम', size: 'md', surface: 'inset', lang: 'hi', defaultValue: 'मीना कुलकर्णी' }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
