name: sahayakai
description: "SahayakAI — native Android app (SARGVISION Intelligence)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (code-gen)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Fonts (runtime fetch for foundation-v1; bundling deferred — see BUILD_STATE.json)
  google_fonts: ^6.2.1

  # Icons (Lucide parity with the web app)
  lucide_icons: ^0.257.0

  # Serialization
  json_annotation: ^4.9.0

  # Local persistence (locale override)
  shared_preferences: ^2.3.3

  # UI / UX
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Motion (the one new sanctioned dependency, PREMIUM_DESIGN_SPEC.md §4):
  # declarative staggered entrances / the Ink-settle result reveal. Every use
  # site is reduce-motion aware (context.motionEnabled) and degrades to the
  # final composed frame.
  flutter_animate: ^4.5.0

  # i18n runtime helpers
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # Camera / gallery image capture (Worksheet Wizard, Assess Assignment).
  # The standard, well-maintained Flutter first-party picker; wraps the native
  # camera + system photo picker and returns an XFile we base64 into the
  # backend's imageDataUri.
  image_picker: ^1.1.2

  # Native share sheet (Parent Message result -> "share to WhatsApp").
  # share_plus is the standard Flutter community share plugin; it opens the OS
  # share sheet so a teacher can send the drafted message to a parent over
  # WhatsApp/SMS. Wrapped behind ShareService so tests fake it (never opens the
  # real sheet).
  share_plus: ^12.0.0

  # ── Voice stack (Pillar 02 / VIDYA, U-V1) ────────────────────────────────
  # The voice-first co-teacher: capture the teacher's spoken request, ship it
  # to STT, and play VIDYA's TTS reply. All four are wrapped behind injectable
  # service abstractions (lib/shared/voice/*) so unit tests never touch a real
  # mic or speaker.
  #
  # record: capture -> WAV 16 kHz mono. WAV (not opus) unlocks the server-side
  # Sarvam Saaras v3 Indic fast path (route only tries Sarvam when the upload
  # MIME matches audio/(mpeg|mp3|wav); see /api/ai/voice-to-text). Exposes a
  # live onAmplitudeChanged stream that drives the listening ring.
  record: ^5.1.2

  # just_audio: playback of the base64-mp3 TTS the backend returns (bytes, not
  # a URL) via a custom StreamAudioSource, in-memory, no temp file. Integrates
  # with audio_session for clean ducking.
  just_audio: ^0.9.42

  # permission_handler: runtime RECORD_AUDIO permission + openAppSettings() on
  # a permanent denial (dignified "Open settings" recovery, never a raw dialog).
  permission_handler: ^11.3.1

  # audio_session: configure the OS audio session (speech(), duck others) so
  # TTS interrupts/ducks correctly. just_audio peer.
  audio_session: ^0.1.21

  # path_provider: a writable temp directory for the recorded WAV before it is
  # multipart-POSTed. record needs a real on-device path; Dart's
  # Directory.systemTemp is not app-writable on Android, so the first-party
  # path_provider is the correct companion to the recorder (not a substitution
  # for any of the four audio plugins above).
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.0

  # Lints
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  # Native branding (icons + launch splash) — replaces the default Flutter logo
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
